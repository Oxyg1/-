<style>
html,body{margin:0}
body{background:#1b0f08;padding:10px 10px max(12px,env(safe-area-inset-bottom));font:14px/1.3 system-ui,sans-serif}
#c{background:#efd6a2 linear-gradient(#f6e4bc,#d9b474);color:#3a1f0c;border:3px double #6b4520;border-radius:10px;padding:10px 12px 12px;text-align:center}
#h{font:800 12px serif;letter-spacing:4px;color:#7a4a1c}
#n{font:800 22px/1.15 serif;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rt{font:900 46px/1 system-ui,sans-serif;letter-spacing:1px}
#rk{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;background:#6b4520;color:#f6e4bc}
#rk:empty{display:none}
#g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.t{background:rgba(107,69,32,.14);border-radius:8px;padding:5px 2px}
.t b{display:block;font:800 19px/1.15 system-ui,sans-serif}
.t small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#7a4a1c}
#f{margin-top:8px;font-size:12px;color:#6b4520}
#e{color:#a98a62;text-align:center;padding:40px 10px}
</style>
<div id=c>
<div id=h>★ РАЗЫСКИВАЕТСЯ ★</div>
<div id=n>…</div>
<div id=rt>—</div>
<div id=rk></div>
<div id=g></div>
<div id=f></div>
</div>
<script>
(function(){
var W=window.TelegramWidget,D=document,E=function(i){return D.getElementById(i)},st=null;
function J(s){try{return JSON.parse(s)}catch(e){return null}}
function v(x,u){return x!=null?x+(u||''):'—'}
function tile(g,x,l){var t=D.createElement('div');t.className='t';var b=D.createElement('b');b.textContent=x;var s=D.createElement('small');s.textContent=l;t.appendChild(b);t.appendChild(s);g.appendChild(t)}
function draw(){
var s=st||{};E('n').textContent=s.n||'…';E('rt').textContent=v(s.rt);
E('rk').textContent=s.rk?'#'+s.rk+' в табло':'';
var g=E('g');g.textContent='';
var n=(s.w||0)+(s.l||0)+(s.d||0);
tile(g,v(s.w),'побед');tile(g,v(s.l),'поражений');tile(g,v(s.d),'ничьих');
tile(g,v(s.b),'лучшая, мс');tile(g,v(s.a),'средняя, мс');tile(g,v(s.s),'серия');
E('f').textContent=n?'дуэлей '+n+' · '+Math.round(100*(s.w||0)/n)+'% побед · рекорд серии '+(s.bs||0)+(s.f?' · фальстартов '+s.f:''):'ещё ни одной дуэли — вызови кого-нибудь в группе'}
function set(o){if(o&&o.u){st=o;draw()}}
W.onEvent('chatDataChanged',function(){set(J(W.chatData))});
set(J(W.chatData));draw();
try{W.ready()}catch(e){}
if(st&&st.u)W.request('st:'+st.u).then(function(a){set(J(a&&a.result))},function(){})
})();
</script>
