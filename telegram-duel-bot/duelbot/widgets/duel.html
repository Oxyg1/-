<style>
html,body{margin:0}
body{position:relative;overflow:hidden;box-sizing:border-box;min-height:320px;color:#fbe9c8;font:15px/1.3 system-ui,sans-serif;text-align:center;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:#2a1640 linear-gradient(#26143a,#6e2c3e 45%,#d0663a 80%,#f3a54a);--sun:#ffd27a;--hill:#3a1a1c;--near:#1c0c0c}
#g{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;z-index:0}
#sun{fill:var(--sun)}#h1{fill:var(--hill)}#h2{fill:var(--near)}.c{stroke:var(--near);fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
#w{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
#t,#s,#m{align-self:stretch}
.p-win #b,.p-lose #b,.p-fs #b,.p-draw #b,.p-find #b{order:9;width:auto;height:auto;border-radius:22px;padding:9px 20px;margin:12px 0 0;font-size:16px;letter-spacing:0;background:#6e4421 linear-gradient(#8a5a2b,#4a2a10)}
#t{font:700 12px/1 serif;letter-spacing:5px;color:#f3c77a;margin:2px 0 6px}
#o{display:inline-block;min-height:16px;font-size:13px;color:#ffe3b8;padding:3px 10px;border-radius:12px;background:rgba(20,8,12,.35)}
#o:empty{visibility:hidden}
#s{font:700 25px/1.15 serif;letter-spacing:1px;margin:10px 0 2px;min-height:29px}
#b{display:block;margin:12px auto 10px;width:126px;height:126px;border-radius:50%;border:5px solid #2a1608;color:#fbe9c8;font:800 22px system-ui,sans-serif;letter-spacing:2px;touch-action:none;background:#6e4421 radial-gradient(circle,#8a5a2b 0 34%,#5a3415 36% 38%,#7a4b22 40%,#4a2a10);box-shadow:0 0 0 4px rgba(255,214,150,.22),inset 0 -8px 0 rgba(0,0,0,.25)}
#b[hidden]{display:none}
#b:disabled{opacity:.7}
#m{min-height:18px;font-size:13px;color:#ffe3b8}
#v{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
#v:empty{display:block;margin:0}
.c2{min-width:96px;padding:6px 10px;border-radius:10px;background:rgba(20,8,12,.45);border:2px solid rgba(255,214,150,.18)}
.c2 small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.75}
.c2 b{font:800 28px/1.1 system-ui,sans-serif}
.c2.h{border-color:#f3c77a;background:rgba(243,199,122,.18)}
#r{margin-top:8px;font:700 17px system-ui,sans-serif;display:inline-block;padding:4px 12px;border-radius:14px;background:rgba(20,8,12,.5)}
#r:empty{display:none}
#r i{font-style:normal}
.up{color:#9be27a}.dn{color:#ff8a70}
.p-lobby #b+#v:before,.p-find #b+#v:before{content:'';display:block;margin:22px auto;width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,214,150,.2);border-top-color:#f3c77a;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.p-wait{background:#160c1c linear-gradient(#0e0814,#2c1020 50%,#6a2418 85%,#8a3420);--sun:#e0602a;--hill:#1e0c10;--near:#0c0506}
.p-wait #b{background:#2e1c10 radial-gradient(circle,#3e2614 0 34%,#24140a 36% 38%,#34200f 40%,#1e1006);color:#d9b27a;animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 14px rgba(255,120,50,.14),inset 0 -8px 0 rgba(0,0,0,.25)}}
.p-go{background:#c4160f linear-gradient(#6a0805,#c4160f 55%,#ff5a1f);--sun:#fff0c0;--hill:#5a0604;--near:#2a0302}
.p-go #s{font-size:32px;color:#fff3dc}
.p-go #b{background:#fff1d6;border-color:#7a0b07;color:#b00e08;font-size:30px;box-shadow:0 0 0 8px rgba(255,240,200,.35);animation:pop .25s}
@keyframes pop{from{transform:scale(.8)}}
.p-win{background:#3a2a08 linear-gradient(#2a1c06,#8a6220 50%,#e8b450 85%,#f6d27a);--sun:#fff6d0;--hill:#4a3008;--near:#2a1a04}
.p-win #s{color:#fff3c4}
.p-lose,.p-fs{background:#1a0707 linear-gradient(#0e0404,#3a0c0c 55%,#6a1a12);--sun:#9a2a1a;--hill:#240808;--near:#100303}
.p-draw,.p-cancel{background:#1d2333 linear-gradient(#151a28,#3a4460 60%,#6a7490);--sun:#c8d0e0;--hill:#1e2436;--near:#0e121c}
</style>
<svg id=g viewBox="0 0 320 110" preserveAspectRatio="xMidYMax slice"><circle id=sun cx=168 cy=70 r=30 /><path id=h1 d="M0 78h34l9-16h52l7 16h58l10 9h24l7-25h48l9 25h62v23H0z"/><path id=h2 d="M0 94q90-12 180-2t140-4v22H0z"/><path class=c d="M38 98V62m0 18h-9v-9m9 4h9v-12M284 96V70m0 14h7v-8"/></svg>
<div id=w>
<div id=t>ДУЭЛЬ</div>
<div id=o></div>
<div id=s>Загрузка…</div>
<button id=b hidden></button>
<div id=v></div>
<div id=m></div>
<div id=r></div>
</div>
<script>
(function(){
var W=window.TelegramWidget,D=document,E=function(i){return D.getElementById(i)},seen=-1,st=null,pend=0,pr=0,lastN=null,note='',hp='',rm=0;
var R={f:'быстрее',fs:'нажал до сигнала',tf:'слишком рано',ot:'соперник не нажал',tie:'разница в пределах погрешности',bfs:'оба нажали до сигнала',nr:'никто не нажал',os:'соперник не нажал',to:'время вышло',ab:'сбой, ставки возвращены',wd:'вызов отменён',q:'поиск остановлен',nf:'никого не нашлось'};
var X={low:'Недостаточно TON на кошельке',nw:'Нет TON-кошелька',bad:'Не удалось',late:'Поздно'};
function J(s){try{return JSON.parse(s)}catch(e){return null}}
function set(o){if(o&&o.p&&o.r>=seen){seen=o.r;st=o}if(o&&o.e)note=X[o.e]||o.e;draw()}
function el(t,c,x){var e=D.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function cell(v,l,x,h){var c=el('div','c2'+(h?' h':''));c.appendChild(el('small','',l));c.appendChild(el('b','',x!=null?x:'—'));c.appendChild(el('small','',x!=null?'мс':''));v.appendChild(c)}
function draw(){
var s=st||{p:'lobby'},p=s.p,T='',B='',M=[],v=E('v'),r=E('r');
D.body.className='p-'+p;v.textContent='';r.textContent='';
E('t').textContent='★ ДУЭЛЬ'+(s.d?' №'+s.d:'')+' ★';
E('o').textContent=s.o?'против '+s.o:'';
if(p=='stake'){T='Ставка: '+s.a+(s.k=='s'?' ⭐':' TON');if(s.k=='t')B='Принять';else M.push('Оплатите счёт в чате выше')}
else if(p=='find'){T='Ищем соперника…';B='Отменить';M.push('твой рейтинг '+s.rt)}
else if(p=='lobby'){T='Ждём соперника…'}
else if(p=='wait'){T='Приготовься…';B='ЖДИ';M.push('не жми раньше сигнала')}
else if(p=='go'){T='СТРЕЛЯЙ!';B='ЖМИ!'}
else{T={win:'🏆 Победа!',lose:'💀 Поражение',fs:'🚫 Фальстарт',draw:'🤝 Ничья',cancel:s.w=='q'||s.w=='nf'?'Поиск окончен':'Дуэль отменена'}[p]||p;
if(s.ms!=null||s.oms!=null){cell(v,'ты',s.ms,p=='win');cell(v,'соперник',s.oms,p=='lose')}
if(R[s.w])M.push(p=='lose'&&s.w=='f'?'соперник быстрее':R[s.w]);
if(s.rt!=null){r.textContent='Рейтинг '+s.rt+' ';if(s.dr!=null)r.appendChild(el('i',s.dr>0?'up':s.dr<0?'dn':'','('+(s.dr>0?'+':s.dr<0?'−':'±')+Math.abs(s.dr)+')'))}
if(s.q=='o')B='Заплатить '+s.a+' TON';else if(s.q=='w')M.push('ждём оплату '+s.a+' TON');else if(s.q=='p')M.push('оплачено ✅');else if(s.q=='u')M.push('не оплачено ⚠');if(!B&&p!='cancel'&&!rm)B='🔁 Реванш'}
E('s').textContent=T;
var b=E('b');b.hidden=!B;b.textContent=B;b.disabled=!!pend||(pr&&(p=='wait'||p=='go'));
E('m').textContent=(note?note+' · ':'')+M.join(' · ');
if(p!=hp){hp=p;var h={go:'warning',win:'success',lose:'error',fs:'error'}[p];if(h){try{W.HapticFeedback.notificationOccurred(h)}catch(e){}}}
}
function done(a){pend=0;set(a&&J(a.result))}
function fail(e){pend=0;note=e&&e.code?e.code:'ошибка';draw()}
function send(d,w){if(pend)return;pend=1;note='';draw();(w?W.request(d,{wallet:true}):W.request(d)).then(done,fail)}
function pay(){
if(pend||!W.wallet){note='Нет кошелька в этом приложении';draw();return}
pend=1;note='';draw();
W.request('pay',{wallet:true}).then(function(a){var t=J(a.result);if(!t||t.e){pend=0;set(t||{});return}
return W.wallet.sendTransaction(t,'paid:'+st.d).then(function(x){pend=0;note='проверяем платёж…';set(J(x.result))})}).then(null,fail)}
function ack(n){
if(pend){setTimeout(function(){ack(n)},600);return}
pend=1;W.request('ack:'+n).then(done,function(e){pend=0;if(e&&e.code=='RATE_LIMITED')setTimeout(function(){ack(n)},1500)})}
E('b').onclick=function(){
var p=st&&st.p;
if(p=='wait'||p=='go'){if(!pend&&!pr){pend=1;pr=1;draw();W.request('p').then(done,function(e){pend=0;pr=0;note=e&&e.code||'ошибка';draw()})}}
else if(p=='find')send('unfind');
else if(p=='stake'&&st.k=='t')send('join',1);
else if(st&&st.q=='o')pay();
else if(st&&!rm){rm=1;send('rematch')}};
function onData(){var o=J(W.chatData);if(o&&o.p){if(o.r>=seen){seen=o.r;if(!st||st.p!=o.p)pr=0;st=o;note='';draw();if(o.p=='lobby'&&o.n&&o.n!=lastN){lastN=o.n;ack(o.n)}}}}
W.onEvent('chatDataChanged',onData);
st=J(W.chatData);if(st)seen=st.r||0;draw();
try{W.ready()}catch(e){}
W.request('hi').then(done,function(e){pend=0})
})();
</script>
