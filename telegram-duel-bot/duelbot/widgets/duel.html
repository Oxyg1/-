<style>
html,body{margin:0}
body{background:#1c1109;color:#ecd9b0;font:15px/1.3 system-ui,sans-serif;text-align:center;padding:14px 10px max(16px,env(safe-area-inset-bottom))}
#t{font:700 22px/1.2 serif;letter-spacing:1px;margin:2px 0 4px}
#s{min-height:20px;color:#c9a96a}
#b{display:block;margin:14px auto 10px;width:148px;height:148px;border-radius:50%;border:6px solid #5a3412;background:#8a5a2b;color:#ecd9b0;font:700 22px system-ui,sans-serif;touch-action:none}
#b:active{background:#6e4521}
#b[hidden]{display:none}
#m{min-height:18px;font-size:13px;color:#a98a55}
.p-go{background:#c4160f}
.p-go #s,.p-go #m{color:#ffd9c0}
.p-go #b{background:#ffe3b3;border-color:#7a0b07;color:#b00e08;font-size:30px}
.p-win{background:#1d2a12}
.p-lose,.p-fs{background:#2a1010}
.p-wait #b{background:#3a2a18;border-color:#5a3412;color:#c9a96a}
</style>
<div id=t>🤠 ДУЭЛЬ</div>
<div id=s>Загрузка…</div>
<button id=b hidden></button>
<div id=m></div>
<script>
(function(){
var W=window.TelegramWidget,D=document,E=function(i){return D.getElementById(i)},seen=-1,st=null,pend=0,pr=0,lastN=null,note='';
var R={f:'быстрее',fs:'нажал до сигнала',tf:'слишком рано',ot:'соперник не нажал',tie:'разница в пределах погрешности',bfs:'оба нажали до сигнала',nr:'никто не нажал',os:'соперник не нажал',to:'время вышло',dc:'отказ',ab:'сбой, ставки возвращены'};
var X={low:'Недостаточно TON на кошельке',nw:'Нет TON-кошелька',bad:'Не удалось',late:'Поздно'};
function J(s){try{return JSON.parse(s)}catch(e){return null}}
function set(o){if(o&&o.p&&o.r>=seen){seen=o.r;st=o}if(o&&o.e)note=X[o.e]||o.e;draw()}
function draw(){
var s=st||{p:'lobby'},p=s.p,T='',B='',M=[];
D.body.className='p-'+p;
if(p=='stake'){T='Ставка: '+s.a+(s.k=='s'?' ⭐':' TON');if(s.k=='t')B='Принять';else M.push('Оплатите счёт в чате выше')}
else if(p=='lobby'){T='Ждём соперника…';if(s.o)M.push('против '+s.o)}
else if(p=='wait'){T='Приготовься…';B='ЖДИ'}
else if(p=='go'){T='СТРЕЛЯЙ!';B='ЖМИ!'}
else{T={win:'🏆 Победа!',lose:'💀 Поражение',fs:'🚫 Фальстарт',draw:'🤝 Ничья',cancel:'Дуэль отменена'}[p]||p;
if(s.ms!=null)M.push('ты '+s.ms+' мс'+(s.oms!=null?', он '+s.oms+' мс':''));
if(R[s.w])M.push(R[s.w]);
if(s.q=='o')B='Заплатить '+s.a+' TON';else if(s.q=='w')M.push('ждём оплату '+s.a+' TON');else if(s.q=='p')M.push('оплачено ✅');else if(s.q=='u')M.push('не оплачено ⚠')}
E('s').textContent=T;
var b=E('b');b.hidden=!B;b.textContent=B;b.disabled=!!pend||(pr&&(p=='wait'||p=='go'));
E('m').textContent=(note?note+' · ':'')+M.join(' · ');
if(p=='go'){try{W.HapticFeedback.notificationOccurred('warning')}catch(e){}}
}
function done(a){pend=0;set(a&&J(a.result))}
function fail(e){pend=0;note=e&&e.code?e.code:'ошибка';draw()}
function send(d,w){if(pend)return;pend=1;note='';draw();(w?W.request(d,{wallet:true}):W.request(d)).then(done,fail)}
function pay(){
if(pend||!W.wallet){note='Нет кошелька в этом приложении';draw();return}
pend=1;note='';draw();
W.request('pay',{wallet:true}).then(function(a){var t=J(a.result);if(!t||t.e){pend=0;set(t||{});return}
return W.wallet.sendTransaction(t,'paid:'+st.d).then(function(x){pend=0;note='проверяем платёж…';set(J(x.result))})}).then(null,fail)}
function ack(n){
if(pend){setTimeout(function(){ack(n)},600);return}
pend=1;W.request('ack:'+n).then(done,function(e){pend=0;if(e&&e.code=='RATE_LIMITED')setTimeout(function(){ack(n)},1500)})}
E('b').onclick=function(){
var p=st&&st.p;
if(p=='wait'||p=='go'){if(!pend&&!pr){pend=1;pr=1;draw();W.request('p').then(done,function(e){pend=0;pr=0;note=e&&e.code||'ошибка';draw()})}}
else if(p=='stake'&&st.k=='t')send('join',1);
else if(st&&st.q=='o')pay()};
function onData(){var o=J(W.chatData);if(o&&o.p){if(o.r>=seen){seen=o.r;if(!st||st.p!=o.p)pr=0;st=o;note='';draw();if(o.p=='lobby'&&o.n&&o.n!=lastN){lastN=o.n;ack(o.n)}}}}
W.onEvent('chatDataChanged',onData);
st=J(W.chatData);if(st)seen=st.r||0;draw();
try{W.ready()}catch(e){}
W.request('hi').then(done,function(e){pend=0})
})();
</script>
