<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3527">
<title>SWAMP</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="levels.js"></script>
<script src="backdrops.js"></script>
<!--CONFIG-->
<style>
:root{
  --acc:#ffd23f; --acc2:#f5a800; --acc-dark:#a86f00; --txt:#fff;
  --bg1:#3aa373; --bg2:#1b6b4a; --bg3:#0c3a2a; --card1:#2a8a5e; --card2:#155a3d;
}
/* фон подарка: цвета приходят из бэкдропа лягушки, которой владеет игрок */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:800;background:#0c3a2a;color:var(--txt);touch-action:manipulation}
#app{height:100dvh;height:var(--tg-viewport-stable-height,100dvh);display:flex;flex-direction:column;gap:8px;
  background:radial-gradient(130% 70% at 50% -10%,var(--bg1) 0%,var(--bg2) 40%,var(--bg3) 100%);transition:background .4s;
  padding:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 16px) 12px calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 12px)}

/* HUD */
.hud{display:flex;align-items:center;gap:5px}
.pill{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.3);border-radius:999px;padding:3px 10px 3px 3px;font-weight:900;font-size:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
.pill img{width:28px;height:28px}
.pill.coins{flex:1;min-width:0}
.pill.coins span{overflow:hidden;text-overflow:ellipsis}
.pill.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.12)}}
.iconbtn{width:37px;height:37px;flex:none;border:0;border-radius:12px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.25);position:relative}
.iconbtn img{width:28px;height:28px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{display:inline-block;flex:none;width:1.1em;height:1.1em;vertical-align:-.18em}
.iconbtn .ic{width:23px;height:23px}
.btn .ic{width:19px;height:19px;vertical-align:-.2em}
.chip .ic,.item .buy .ic{width:16px;height:16px;vertical-align:-.2em}
.head h2 .ic{width:21px;height:21px;vertical-align:-.2em}
.pond .t .ic{width:16px;height:16px;vertical-align:-.22em}
.lb .rk .ic{width:25px;height:25px;vertical-align:-.4em}
.ic.m1{color:#ffd23f}.ic.m2{color:#d3dae0}.ic.m3{color:#cd8032}
.ic.gold{color:#ffd23f}
.badge .ic{width:11px;height:11px;vertical-align:-.12em}
#hint .ic{width:16px;height:16px;vertical-align:-.22em}
#loading h2 .ic{width:26px;height:26px;vertical-align:-.25em}
.float .ic{width:19px;height:19px;vertical-align:-.2em}
.frog .lvl .ic{width:9px;height:9px;vertical-align:0}
.iconbtn:active{transform:scale(.92)}

#hint{text-align:center;font-size:15px;min-height:20px;opacity:.9;transition:opacity .3s;line-height:1.25}
#hint.hide{opacity:0}

/* BOARD */
.board-wrap{display:flex;justify-content:center}
#board{position:relative;width:min(100%,calc(100dvh - 370px));min-width:240px;aspect-ratio:1;border-radius:22px;background:rgba(0,0,0,.25);box-shadow:inset 0 4px 14px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.06);touch-action:none}
.cell{position:absolute;border-radius:14px;background:rgba(255,255,255,.09);box-shadow:inset 0 2px 0 rgba(255,255,255,.06);transition:background .15s,box-shadow .15s}
.cell.hl{background:rgba(255,210,63,.35);box-shadow:inset 0 0 0 3px var(--acc)}
/* тень висит на статичном контейнере, а не на картинке, которая крутится в idle-анимации —
   иначе телефон каждый кадр пересчитывает drop-shadow разом для четверти доски, и всё тормозит */
.frog{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);transform:translate(var(--x),var(--y));transition:transform .2s cubic-bezier(.2,.8,.2,1.15);will-change:transform;display:flex;align-items:center;justify-content:center;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.frog img{width:96%;height:96%;object-fit:contain;transform-origin:50% 90%;will-change:transform}
.frog .lvl{position:absolute;right:3px;bottom:2px;font-size:11px;font-weight:900;line-height:16px;background:rgba(0,0,0,.5);border-radius:8px;padding:0 5px;color:#ffe680}
.frog.wild .lvl{background:linear-gradient(90deg,#ff5d7a,#ffd23f,#7fe3ff);color:#222}
.frog.wild{filter:drop-shadow(0 0 6px #ffd23f) drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.frog.junk::after{content:"";position:absolute;left:2px;top:1px;width:14px;height:14px;background:url("icons/meat.png") center/contain no-repeat;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.frog.selected img{animation:wiggle .45s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) scale(1.06)}50%{transform:rotate(6deg) scale(1.06)}}
.frog.dragging{transition:none;z-index:20}
.frog.dragging img{transform:scale(1.18);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.frog.pop img{animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.frog.merging{transition:transform .22s cubic-bezier(.5,0,.8,.4);z-index:5}
.frog.merging img{transform:scale(.6);opacity:.8}
.frog.idle img{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.03)}}
.frog.eaten{transition:transform .25s cubic-bezier(.5,0,.9,.4),opacity .25s;opacity:0}

/* ACTION BAR */
#actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:0}
#actions:empty{display:none}
.chip{border:0;border-radius:999px;padding:8px 14px;font:900 14px Nunito,system-ui;color:#fff;background:rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.1)}
.chip.gold{background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;box-shadow:0 3px 0 var(--acc-dark)}
.chip.red{background:linear-gradient(#ff8fa3,#e0405f);color:#fff;box-shadow:0 3px 0 #8f1f36}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip img{width:20px;height:20px}

/* CLICKER */
.clicker-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:0;position:relative}
#combo{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;transform:translateY(-4px)}
#combo.on{opacity:1}
#combo .cb{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 12px 3px 6px;font-size:16px;font-weight:900;color:#ffd23f}
#combo img{width:24px;height:24px}
#clicker.feed{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 3px rgba(255,210,63,.6)}
#clicker.feed{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 3px rgba(255,210,63,.6)}
#clicker{flex:1;min-height:110px;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative;border-radius:24px;transition:background .15s}
#clicker::before{content:"";position:absolute;left:50%;bottom:6%;width:46%;height:8%;transform:translateX(-50%);background:rgba(0,0,0,.28);border-radius:50%;filter:blur(4px)}
#clickerLottie{height:100%;aspect-ratio:1;max-height:230px;transition:transform .09s cubic-bezier(.2,.8,.2,1);position:relative;transform-origin:50% 92%}
#clickerLottie svg{display:block}
#clickerLottie.squash{transform:scale(1.1,.88)}
#fly{position:absolute;right:14%;top:12%;width:30px;height:30px;display:none;animation:fly 1.6s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#fly .ic{width:100%;height:100%}
#fly.on{display:block}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(-14px,10px) rotate(10deg)}}
#frogName{font-size:17px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
#frogName small{font-size:13px;opacity:.8;font-weight:800}
.boost{font-size:12px;background:rgba(255,93,122,.35);border-radius:999px;padding:2px 8px;color:#ffd23f}

#btnSpawn{width:100%;max-width:380px;border:0;border-radius:24px;padding:9px 14px 9px 9px;background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;font:900 20px/1 Nunito,system-ui;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--acc-dark),0 12px 18px rgba(0,0,0,.35);transition:transform .07s,box-shadow .07s,filter .2s;touch-action:none}
#btnSpawn img.fr{width:44px;height:44px;background:rgba(255,255,255,.35);border-radius:14px}
#btnSpawn .cost{display:flex;align-items:center;gap:4px;background:rgba(90,59,0,.15);border-radius:999px;padding:4px 10px 4px 5px;font-size:17px}
#btnSpawn .cost img{width:22px;height:22px}
#btnSpawn.down,#btnSpawn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-dark),0 4px 8px rgba(0,0,0,.35)}
#btnSpawn.poor{filter:grayscale(.55) brightness(.85)}
#btnSpawn.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 10px rgba(0,0,0,.4);animation:floatUp .85s cubic-bezier(.1,.7,.3,1) forwards;transform:translate(-50%,-50%);white-space:nowrap}
.float.crit{color:#ffd23f;font-size:32px;animation-duration:1.1s}
.float.big{color:#9dffb0;font-size:26px}
.float.small{font-size:15px;opacity:.8}
@keyframes floatUp{to{transform:translate(-50%,-160%) scale(1.1);opacity:0}}
.coinp{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);animation:coinp .7s cubic-bezier(.2,.7,.3,1) forwards;background:url("icons/coin.png") center/contain no-repeat}
@keyframes coinp{0%{transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9) rotate(var(--r));opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c,#fff);transform:translate(-50%,-50%);animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);background:rgba(0,0,0,.75);border-radius:16px;padding:10px 16px;font-size:16px;opacity:0;transition:opacity .25s,transform .25s;z-index:200;pointer-events:none;text-align:center;max-width:82vw}
#toast.on{opacity:1;transform:translate(-50%,-8px)}

/* OVERLAYS */
/* поверх #app свой fixed-слой на весь экран — safe-area сюда сам не приходит,
   прописываем те же отступы явно, иначе шапка окна лезет под чёлку/статус-бар в фулскрине */
.overlay{position:fixed;inset:0;background:rgba(3,25,17,.88);display:flex;align-items:center;justify-content:center;z-index:100;
  padding:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 16px) 16px calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 16px)}
.overlay.hidden{display:none}
.card{background:linear-gradient(var(--card1),var(--card2));border-radius:28px;padding:18px 16px;width:100%;max-width:400px;max-height:92dvh;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.15);position:relative;overflow:hidden;animation:cardIn .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cardIn{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:24px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .sub{opacity:.85;font-size:15px;text-align:center}
.head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.head h2{font-size:22px}
.scroll{width:100%;overflow:auto;flex:1;min-height:0;padding:2px}
#luLottie{width:200px;height:200px}
#luName{font-size:24px;color:#ffd23f;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#luLv{display:flex;align-items:center;gap:6px;font-size:17px}
#luLv img{width:24px;height:24px}
.btn{border:0;border-radius:18px;padding:12px 24px;background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;font:900 18px Nunito,system-ui;box-shadow:0 5px 0 var(--acc-dark);margin-top:4px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc-dark)}
.btn.ghost{background:rgba(0,0,0,.3);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.4);font-size:15px;padding:9px 16px}
.btn.sm{font-size:15px;padding:9px 16px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.conf{position:absolute;width:10px;height:14px;top:-20px;background:var(--c);animation:conf 2.2s linear infinite;border-radius:2px}
@keyframes conf{to{transform:translateY(120vh) rotate(720deg)}}
.rar{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.35);color:#ffe680}

#colGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.slot{aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;gap:2px;position:relative}
.slot img{width:70%;height:70%;object-fit:contain}
.slot.locked{opacity:.55}
.slot.locked img{filter:brightness(0) opacity(.5)}
.slot .n{position:absolute;top:2px;left:6px;font-size:10px;color:#ffe680}
.slot.cur{box-shadow:inset 0 0 0 3px var(--acc)}
.slot.mine{box-shadow:inset 0 0 0 3px #ff5d7a}

/* SHOP */
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.25);border-radius:16px;padding:10px;margin-bottom:8px}
.item img{width:52px;height:52px;object-fit:contain}
.item.expandable{cursor:pointer}
.item .chev{display:block;font-style:normal;font-size:12px;font-weight:800;color:var(--acc);margin-top:3px}
.bundle{grid-column:1/-1;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:7px}
.bundle-row{display:flex;align-items:center;gap:8px;font-size:13.5px}
.bundle-row img{width:24px;height:24px;object-fit:contain;flex:none}
.bundle-row span{flex:1;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bundle-row b{font-weight:800;white-space:nowrap;opacity:.75;flex:none}
.bundle-row b img{width:14px;height:14px;vertical-align:-2px}
.bundle-total{font-size:13px;font-weight:800;color:#ffe680;padding-top:2px}
.bundle-total s{opacity:.6;font-weight:700}
.bundle-total img{width:14px;height:14px;vertical-align:-2px}
.bdview{width:52px;height:52px;border-radius:14px;display:block;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.35)}
.item b{display:block;font-size:15px}
.item span{font-size:12.5px;opacity:.85;font-weight:700;line-height:1.25;display:block}
.item .buy{border:0;border-radius:14px;padding:9px 12px;background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;font:900 14px Nunito,system-ui;box-shadow:0 3px 0 var(--acc-dark);white-space:nowrap}
.item .buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--acc-dark)}
.item .buy.owned{background:rgba(0,0,0,.35);color:#9dffb0;box-shadow:none}
.item .buy.time{background:rgba(0,0,0,.35);color:#ffe680;box-shadow:none}
.item.donate{grid-template-columns:52px 1fr}
.item.donate .row{justify-content:flex-start;margin-top:6px}
.item.donate .buy{padding:7px 10px}
.stars{font-size:12px;opacity:.85;text-align:center;line-height:1.45}
.stars .muted{opacity:.7}
.shop-h{font:900 12.5px Nunito,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:14px 2px 7px}
.offer{border:2px solid var(--acc);border-radius:18px;padding:8px;margin-bottom:6px;background:rgba(255,210,63,.08)}
.offer-t{font:900 11.5px Nunito,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--acc);margin:2px 4px 6px}
.offer .item{margin:0;background:rgba(0,0,0,.28)}
.badge2{display:inline-block;font:900 10px Nunito,sans-serif;font-style:normal;letter-spacing:.04em;text-transform:uppercase;background:var(--acc);color:#5a3b00;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.item .live{color:#9dffb0;font-size:12px}
.pricebox{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pricebox s{font-size:11.5px;opacity:.6}

/* LEADERBOARD */
.pond{width:100%;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px}
.pond .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.pond .bar{height:10px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.pond .bar i{display:block;height:100%;background:linear-gradient(90deg,#9dffb0,#ffd23f);width:0;transition:width .5s}
.lb{display:grid;grid-template-columns:30px 44px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:12px;font-size:14px}
.lb.me{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 2px rgba(255,210,63,.6)}
.lb .rk{font-weight:900;color:#ffe680;text-align:center}
.lb .rk.top{font-size:18px}
.lb img{width:44px;height:44px;object-fit:contain}
.lb .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .nm small{display:block;font-size:11px;opacity:.75}
.lb .sc{font-weight:900;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:#ff5d7a;color:#fff;margin-left:4px;vertical-align:middle}
.demo{font-size:12px;opacity:.75;text-align:center}

/* CARD PREVIEW */
#cardImg{max-width:100%;max-height:60dvh;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

#loading .card{align-items:center;gap:4px}
#loadFrog{width:min(46vw,190px);aspect-ratio:1;margin-bottom:2px}
#loadFrog svg,#loadFrog img{display:block;width:100%;height:100%;object-fit:contain}
#loading h2{font-size:20px}
#loading .bar{width:100%;height:12px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
@media (prefers-reduced-motion:reduce){.frog.idle img,#fly{animation:none}}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false"><defs>
<symbol id="i-trophy" viewBox="0 0 24 24">
  <path d="M5.2 3.4h13.6v4.8c0 3.9-3 6.9-6.8 6.9s-6.8-3-6.8-6.9V3.4z" fill="#ffd23f"/>
  <path d="M5.2 5.2H2.9v1.3c0 2 1.6 3.7 3.6 3.8" fill="none" stroke="#ffd23f" stroke-width="1.9" stroke-linecap="round"/>

<script>
(()=>{
'use strict';
const CFG=Object.assign({api:'',appLink:'https://t.me/swampis_bot',chat:'https://t.me/FrogGame',holders:'https://t.me/kissed_frog_holders',pondGoal:50000},window.FROG_CFG||{});
const WILD=99, GAP=5, PAD=7, SAVE_KEY='frogmerge.v2', THUMB_FRAME=0, DAY=86400e3;
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const now=()=>Date.now();
const ic=(n,cls='')=>`<svg class="ic ${cls}"><use href="#i-${n}"></use></svg>`;

/* ---------- TELEGRAM ---------- */
const TG=(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!==undefined)?window.Telegram.WebApp:null;
const inTG=!!(TG&&TG.initData);
const tgv=v=>{if(!TG||!TG.version)return false;const [a,b]=TG.version.split('.').map(Number),[c,d]=v.split('.').map(Number);return a>c||(a===c&&b>=d);};
if(TG){
  try{TG.ready();TG.expand();}catch(e){}
  try{TG.setHeaderColor('#0c3a2a');TG.setBackgroundColor('#0c3a2a');if(tgv('7.10'))TG.setBottomBarColor('#0c3a2a');}catch(e){}
  try{if(tgv('7.7'))TG.disableVerticalSwipes();}catch(e){}
  // полноэкранный режим: Telegram сам скрывает свою шапку, наш отступ сверху — единственное,
  // что защищает интерфейс от чёлки/статус-бара, поэтому safe-area-инсеты здесь особенно важны
  try{if(tgv('8.0')&&typeof TG.requestFullscreen==='function')TG.requestFullscreen();}catch(e){}
}
const haptic={
  light:()=>{try{TG?TG.HapticFeedback.impactOccurred('light'):navigator.vibrate&&navigator.vibrate(8);}catch(e){}},
  medium:()=>{try{TG?TG.HapticFeedback.impactOccurred('medium'):navigator.vibrate&&navigator.vibrate(20);}catch(e){}},
  heavy:()=>{try{TG?TG.HapticFeedback.impactOccurred('heavy'):navigator.vibrate&&navigator.vibrate([20,30,40]);}catch(e){}},
  success:()=>{try{TG?TG.HapticFeedback.notificationOccurred('success'):navigator.vibrate&&navigator.vibrate([30,40,30,40,80]);}catch(e){}},
  error:()=>{try{TG?TG.HapticFeedback.notificationOccurred('error'):navigator.vibrate&&navigator.vibrate(40);}catch(e){}},
  select:()=>{try{TG?TG.HapticFeedback.selectionChanged():navigator.vibrate&&navigator.vibrate(6);}catch(e){}},
};
const openTg=url=>{if(TG&&tgv('6.1'))TG.openTelegramLink(url);else window.open(url,'_blank');};
const tgUser=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||null;
const myName=tgUser?(tgUser.first_name||tgUser.username||'Игрок'):'Ты';

/* ---------- STATE ---------- */
const state={coins:0,maxLv:1,n:5,cells:Array(25).fill(0),disc:[1],sound:true,merges:0,score:0,taps:0,wild:0,theme:'',inv:{},order:null,own:[],t:0};
// базовый порядок уровней — как в списке редкости. Лягушки, которыми игрок владеет,
// поднимаются в самый верх лестницы, поэтому у каждого владельца свой финал.
const BASE=LEVELS.slice();
const slugOf=name=>{const L=BASE.find(l=>l.n.toLowerCase()===String(name||'').toLowerCase());return L?L.f:null;};
function buildOrder(models){
  const own=[...new Set((models||[]).map(slugOf).filter(Boolean))];
  if(!own.length)return BASE.map(l=>l.f);
  const mine=own.map(f=>BASE.find(l=>l.f===f));
  // среди своих сохраняем ту же логику: самая редкая — самой последней
  mine.sort((a,b)=>BASE.indexOf(a)-BASE.indexOf(b));
  return [...BASE.filter(l=>!own.includes(l.f)),...mine].map(l=>l.f);
}
// перестановка лестницы с переносом уже добытых лягушек: на поле остаются те же виды
function applyOrder(order){
  if(!order||order.length!==BASE.length)return false;
  if(order.join()===LEVELS.map(l=>l.f).join())return false;
  const old=LEVELS.slice();
  const next=order.map(f=>BASE.find(l=>l.f===f)).filter(Boolean);
  if(next.length!==BASE.length)return false;
  const idx=f=>next.findIndex(l=>l.f===f)+1;
  state.cells=state.cells.map(v=>(v&&v!==WILD&&old[v-1])?idx(old[v-1].f):v);
  state.disc=(state.disc||[]).map(v=>old[v-1]?idx(old[v-1].f):v).filter(v=>v>=1&&v<=next.length);
  LEVELS.length=0;LEVELS.push(...next);
  state.order=order;
  return true;
}
const ownsLevel=lv=>{const L=LEVELS[lv-1];return !!(L&&(state.own||[]).some(m=>slugOf(m)===L.f));};
let N=5,CELLS=25;
function applySave(s){
  if(!s||!Array.isArray(s.cells))return;
  if((s.t||0)<(state.t||0))return;
  Object.assign(state,s);
  if(!state.inv)state.inv={};
  // лечим сейвы с уровнем выше последнего: такой прогресс раньше падал на несуществующей лягушке
  state.maxLv=Math.max(1,Math.min(state.maxLv|0||1,LEVELS.length));
  state.cells=state.cells.map(v=>v===WILD?v:Math.min(v|0,LEVELS.length));
  state.disc=(Array.isArray(state.disc)?state.disc:[1]).filter(l=>l>=1&&l<=LEVELS.length);
  if(Array.isArray(state.order)&&state.order.length===BASE.length){const o=state.order;state.order=null;applyOrder(o);}
  N=state.n||5;CELLS=N*N;
  if(state.cells.length!==CELLS){const old=state.cells,on=Math.round(Math.sqrt(old.length));const nc=Array(CELLS).fill(0);for(let r=0;r<Math.min(on,N);r++)for(let c=0;c<Math.min(on,N);c++)nc[r*N+c]=old[r*on+c]||0;state.cells=nc;}
}
const cloudOk=()=>TG&&tgv('6.9')&&TG.CloudStorage;
async function load(){
  try{applySave(JSON.parse(localStorage.getItem(SAVE_KEY)));}catch(e){}
  if(!state.t){try{const o=JSON.parse(localStorage.getItem('frogmerge.v1'));if(o){o.t=1;applySave(o);}}catch(e){}}
  if(cloudOk()){try{const v=await Promise.race([new Promise((res,rej)=>TG.CloudStorage.getItem(SAVE_KEY,(err,val)=>err?rej(err):res(val))),wait(2500).then(()=>null)]);if(v)applySave(JSON.parse(v));}catch(e){}}
}
let saveT=null,resetting=false;
function save(){
  if(resetting)return;
  state.t=now();
  const json=JSON.stringify(state);
  try{localStorage.setItem(SAVE_KEY,json);}catch(e){}
  if(cloudOk()){clearTimeout(saveT);saveT=setTimeout(()=>{try{TG.CloudStorage.setItem(SAVE_KEY,json,()=>{});}catch(e){}},800);}
}

/* ---------- ECONOMY ---------- */
const boostMult=()=>(state.inv.boostUntil||0)>now()?2:1;
const autoOn=()=>!!state.inv.autoForever||(state.inv.autoUntil||0)>now()||(state.inv.subUntil||0)>now();
const tapValue=()=>Math.ceil(Math.pow(1.5,state.maxLv-1))*boostMult();
const baseSpawnLv=()=>Math.max(1,state.maxLv-2);
const spawnCapLv=()=>Math.max(1,state.maxLv-1);
function nice(n){n=Math.max(1,Math.round(n));if(n<30)return n;const p=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.round(n/p)*p;}
const spawnCost=()=>nice(Math.ceil(Math.pow(1.5,state.maxLv-1))*(5+state.maxLv*0.4));
const isFrog=v=>v>0&&v!==WILD;
function levelCounts(){const c={};state.cells.forEach(v=>{if(isFrog(v))c[v]=(c[v]||0)+1;});return c;}
function rollSpawnLevel(){
  const b=baseSpawnLv(),cap=spawnCapLv(),counts=levelCounts();
  const cands=[];for(let l=b;l<=Math.min(b+2,cap);l++)cands.push(l);
  if(!cands.length)return b;
  const w=cands.map((l,i)=>{let x=[0.6,0.3,0.1][i]||0.1;const m=(counts[l]||0)%3;if(m===2)x*=3;else if(m===1)x*=1.6;return x;});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<cands.length;i++){r-=w[i];if(r<=0)return cands[i];}
  return cands[cands.length-1];
}
const mergeReward=(newLv,combo)=>nice(spawnCost()*0.4*Math.pow(1.5,newLv-baseSpawnLv()-1)*combo);
const feedReward=lv=>lv===WILD?nice(spawnCost()*0.3):nice(spawnCost()*0.35*Math.pow(2.6,lv-baseSpawnLv()));
const isJunk=lv=>isFrog(lv)&&lv<baseSpawnLv();
function fmt(n){if(n<1000)return String(Math.round(n));const u=['K','M','B','T','q','Q'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}return (n<100?n.toFixed(1):Math.round(n))+u[i];}
const rarity=lv=>lv>=1&&lv<=LEVELS.length?LEVELS[lv-1].r:null;
const rarTxt=lv=>{const r=rarity(lv);return r==null?'':String(r).replace('.',',')+'%';};

/* ---------- ASSETS ---------- */
const frogFile=lv=>typeof lv==='string'?lv:(lv===0||lv===WILD)?'original':LEVELS[lv-1].f;
const frogName=lv=>lv===WILD?'Дикая лягушка':lv===0?'Original':LEVELS[lv-1].n;
const dataCache=new Map();
function loadFrogData(lv){
  if(!dataCache.has(lv)){
    dataCache.set(lv,(async()=>{
      let bytes;const f=frogFile(lv);
      if(window.EMBED&&window.EMBED[f]){const b=atob(EMBED[f]);bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);}
      else{const r=await fetch('frogs/'+f+'.tgs');if(!r.ok)throw new Error('load '+f);bytes=new Uint8Array(await r.arrayBuffer());}
      let text;
      if(window.DecompressionStream){try{const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));text=await new Response(s).text();}catch(e){text=null;}}
      if(!text)text=pako.ungzip(bytes,{to:'string'});
      return JSON.parse(text);
    })());
  }
  return dataCache.get(lv);
}
async function bake(lv,size){
  const data=structuredClone(await loadFrogData(lv));
  const c=document.createElement('canvas');c.width=c.height=size;
  const anim=lottie.loadAnimation({renderer:'canvas',loop:false,autoplay:false,animationData:data,rendererSettings:{context:c.getContext('2d'),clearCanvas:true,preserveAspectRatio:'xMidYMid meet'}});
  await new Promise(r=>{anim.addEventListener('DOMLoaded',r);setTimeout(r,400);});
  anim.goToAndStop(THUMB_FRAME,true);
  anim.destroy();return c;
}
const thumbs=new Map(),thumbPromises=new Map();
function thumb(lv){
  if(thumbPromises.has(lv))return thumbPromises.get(lv);
  const p=bake(lv,256).then(c=>{const u=c.toDataURL('image/png');thumbs.set(lv,u);return u;});
  thumbPromises.set(lv,p);return p;
}

/* ---------- ЗВУК ----------
   Правила, по которым это собрано:
   • тап — сухой и короткий (60 мс), без хвоста эха: иначе при 10 тапах в секунду
     звуки накладываются в кашу;
   • питч тапа случайно гуляет ±12% — мозг перестаёт слышать повтор;
   • полифония ограничена: больше 6 голосов одновременно не звучит, иначе громкость
     складывается и режет уши;
   • при спаме тапов громкость приседает на 35%;
   • слияние — питч по уровню лягушки: мелкие тонко и высоко, крупные низко и густо,
     на слух понятно, что собрал что-то ценное;
   • каскад ведёт ноту вверх по пентатонике: цепочка ощущается физически;
   • всё в до-мажоре, награды заметно громче рутины. */
let ac=null,dry=null,send=null,voices=0;
function audio(){
  if(!ac){
    try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
    const master=ac.createGain();master.gain.value=.9;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;lp.Q.value=.5;
    master.connect(lp);lp.connect(ac.destination);
    dry=ac.createGain();dry.gain.value=1;dry.connect(master);
    // эхо только для наград, тапы туда не идут принципиально
    const dl=ac.createDelay(1);dl.delayTime.value=.17;
    const fb=ac.createGain();fb.gain.value=.24;
    const wet=ac.createGain();wet.gain.value=.34;
    send=ac.createGain();send.gain.value=1;
    send.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
    send.connect(master);
  }
  if(ac.state==='suspended')ac.resume();
  return ac;
}
const SCALE=[0,2,4,7,9];                                  // до-мажорная пентатоника
const note=(deg,oct=0)=>261.63*Math.pow(2,oct+Math.floor(deg/5))*Math.pow(2,SCALE[((deg%5)+5)%5]/12);
// один голос. reward=true — уходит в эхо и звучит громче
function voice(f,dur,vol,t0=0,{glide=0,reward=false,type='sine'}={}){
  const a=audio();if(!a||!state.sound)return;
  if(!isFinite(f)||voices>=6)return;                      // потолок полифонии
  const t=a.currentTime+t0;
  voices++;setTimeout(()=>voices--,(t0+dur)*1000+40);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*glide),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(reward?send:dry);
  o.start(t);o.stop(t+dur+.02);
  if(reward&&vol>.05){                                    // октава сверху для «стекла»
    const o2=a.createOscillator(),g2=a.createGain();
    o2.type='sine';o2.frequency.setValueAtTime(f*2,t);
    g2.gain.setValueAtTime(.0001,t);
    g2.gain.exponentialRampToValueAtTime(vol*.2,t+.01);
    g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.55);
    o2.connect(g2).connect(send);o2.start(t);o2.stop(t+dur+.02);
  }
}
function thud(vol,t0=0,f=140){
  const a=audio();if(!a||!state.sound)return;
  const t=a.currentTime+t0;
  const o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.13);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+.16);
  o.connect(g).connect(dry);o.start(t);o.stop(t+.2);
}
let tapAt=0,tapRate=0;
const S={
  // сухой короткий «пок». Частим — звук приседает, чтобы не резал уши
  pop:crit=>{
    const t=now(),gap=t-tapAt;tapAt=t;
    tapRate=gap<100?Math.min(tapRate+1,10):Math.max(tapRate-1,0);
    const duck=tapRate>5?.65:1;                            // спам — тише на 35%
    const pitch=1+(Math.random()*.24-.12);                 // ±12%
    voice(523.25*pitch,.06,.05*duck,0,{glide:.55});
    if(crit){voice(784*pitch,.09,.05,.02);voice(1046*pitch,.12,.03,.05);}
  },
  spawn:()=>voice(659*(1+(Math.random()*.2-.1)),.07,.035,0,{glide:1.3}),
  // слияние: чем выше уровень лягушки, тем ниже и толще; каскад ведёт вверх по гамме
  merge:(c,lv)=>{
    const tier=Math.min(Math.max(lv||1,1),50);
    const oct=1-Math.floor((tier-1)/12);                   // высокие тиры звучат ниже
    const step=Math.min(Math.max(c-1,0),6);                // ступень каскада
    [0,2,4].forEach((d,k)=>voice(note(step+d,oct),.5,.085,k*.06,{reward:true}));
    thud(.06,0,120+tier);
  },
  // новый максимум — редкое событие, можно позволить настоящую мелодию
  level:()=>{
    [0,2,4,5,7].forEach((d,k)=>voice(note(d,1),.55,.09,k*.1,{reward:true}));
    voice(note(9,1),1.2,.07,.55,{reward:true});
    thud(.09,0,110);
  },
  eat:()=>{thud(.06,0,160);voice(note(1),.12,.03,.02,{glide:.6});},
  err:()=>thud(.07,0,90),                                  // мягкий низкий стук, не резкий
  ui:()=>voice(note(6),.045,.018),                         // почти неслышный тик
  buy:()=>{[0,2,4].forEach((d,k)=>voice(note(d+3,1),.5,.08,k*.07,{reward:true}));},
};

const fx=$('#fx');
function floatText(x,y,txt,cls='',html=false){const el=document.createElement('div');el.className='float '+cls;if(html)el.innerHTML=txt;else el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),1200);}
function coinBurst(x,y,n){

  for(let i=0;i<n;i++){const el=document.createElement('div');el.className='coinp';const a=rnd(-Math.PI,0)+rnd(-.5,.5),d=rnd(40,110);el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',(Math.sin(a)*d-30)+'px');el.style.setProperty('--r',rnd(-180,180)+'deg');el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),800);}}
function sparks(x,y,n,colors){
  if(fx.childElementCount>90)return;
  for(let i=0;i<n;i++){const el=document.createElement('div');el.className='spark';const a=rnd(0,Math.PI*2),d=rnd(30,90);el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d+'px');el.style.setProperty('--c',pick(colors));el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),700);}}
let toastT=null;function toast(t,ms=1800){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms);}

/* ---------- NETWORK ---------- */
const net={online:false,me:null,top:[],pond:{count:0,goal:CFG.pondGoal},holder:null,lastSync:0};
async function api(path,body){
  if(!CFG.api)throw new Error('no api');
  const r=await fetch(CFG.api+'/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:TG?TG.initData:'',dev:!inTG},body||{}))});
  if(!r.ok)throw new Error('api '+r.status);
  return r.json();
}
function applyOwnership(){
  const frogs=(net.holder&&net.holder.frogs)||[];
  const models=frogs.map(f=>f.model).filter(Boolean);
  state.own=models;
  const want=buildOrder(models);
  if(applyOrder(want)){
    // лестница поменялась — перерисовываем поле и кликер под новый порядок
    if(cellEls.length)buildBoard();
    setClickerSkin(Math.max(1,Math.min(state.maxLv,LEVELS.length)));
    save();
  }
}
function applyServer(r){
  if(!r||!r.ok)return;
  net.online=true;net.me=r.me||null;net.top=r.top||[];if(r.pond)net.pond=r.pond;net.holder=r.holder||null;net.lastSync=now();
  applyOwnership();
  if(r.inv){Object.assign(state.inv,r.inv);applyInv();}
  if(r.wild!=null&&r.wild>state.wild)state.wild=r.wild;
}
async function sync(force){
  if(!CFG.api)return null;
  if(!force&&now()-net.lastSync<15000)return null;
  try{const r=await api('sync',{name:myName,coins:Math.round(state.coins),maxLv:state.maxLv,score:state.score,merges:state.merges,taps:state.taps,theme:state.theme,wild:state.wild});applyServer(r);save();updateHud();return r;}
  catch(e){net.online=false;return null;}
}

function addCoins(v){

  updateCounters();

function canMergeAny(){const c=levelCounts();const w=state.cells.filter(v=>v===WILD).length;const lv=Object.keys(c).map(Number);if(lv.some(l=>c[l]>=3))return true;if(w>=1&&lv.some(l=>c[l]>=2))return true;if(w>=2&&lv.length)return true;return false;}
function updateHint(){
  const h=$('#hint');let t='';
  const count=state.cells.filter(Boolean).length,c=levelCounts();
  const full=count===CELLS;
  if(count===0&&state.coins<spawnCost())t=ic('down')+' Тапай по лягушке — копи монеты';
  else if(count<3&&state.coins>=spawnCost())t='Жми «Призвать» — лягушки появятся на поле';
  else if(count>=3&&state.merges===0)t='Собери 3 одинаковых в ряд — перетащи лягушку';
  else if(full&&!canMergeAny())t='Тупик! Скорми слабых кликеру или используй дикую лягушку';
  else if(full){const l=Object.keys(c).map(Number).filter(l=>c[l]>=3).sort((a,b)=>b-a)[0];t=l?`Поле заполнено. Собери три лягушки ур. ${l} в ряд`:'Поле заполнено. Поставь дикую лягушку к двум одинаковым';}
  if(h.dataset.t!==t){h.dataset.t=t;h.innerHTML=t;}
  h.classList.toggle('hide',!t);
}
let actSig='';
function renderActions(){
  const a=$('#actions');
  // подпись состояния: пока она та же — DOM не трогаем
  const junkN=state.cells.filter(isJunk).length;
  const sig=[selected,selected>=0?state.cells[selected]:0,junkN,state.wild,
             state.cells.filter(Boolean).length===CELLS,canMergeAny()].join('|');
  if(sig===actSig)return;
  actSig=sig;
  a.innerHTML='';
  const junk=state.cells.map((v,i)=>isJunk(v)?i:-1).filter(i=>i>=0);

  if(selected>=0&&state.cells[selected]){
    const lv=state.cells[selected];
    const b=document.createElement('button');b.className='chip red';b.innerHTML=`<img src="icons/meat.png" alt="">Скормить <b>+${fmt(feedReward(lv))}</b>`;b.onclick=()=>{const i=selected;setSelected(-1);feedFrog(i);};a.appendChild(b);
    const c=document.createElement('button');c.className='chip';c.textContent='Отмена';c.onclick=()=>{setSelected(-1);};a.appendChild(c);
    return;
  }
  if(junk.length>=2){
    const total=junk.reduce((s,i)=>s+feedReward(state.cells[i]),0);
    const b=document.createElement('button');b.className='chip red';b.innerHTML=`<img src="icons/meat.png" alt="">Скормить слабых (${junk.length}) <b>+${fmt(total)}</b>`;b.onclick=feedJunk;a.appendChild(b);
  }
  if(state.wild>0){
    const w=document.createElement('button');w.className='chip gold';w.innerHTML=`<img src="${thumbs.get(WILD)||''}" alt="">Дикая лягушка ×${state.wild}`;w.onclick=placeWild;a.appendChild(w);
  }else if(full&&!canMergeAny()){
    const w=document.createElement('button');w.className='chip gold';w.innerHTML=`<img src="${thumbs.get(WILD)||''}" alt="">Дикая лягушка · 39${ic('star')}`;w.onclick=()=>openShop('wild3');a.appendChild(w);
  }
}

/* ---------- BOARD ---------- */
const board=$('#board');
let cellEls=[],els=[],cs=60;
const cellXY=i=>[PAD+(i%N)*(cs+GAP),PAD+Math.floor(i/N)*(cs+GAP)];
function buildBoard(){
  board.innerHTML='';cellEls=[];els=Array(CELLS).fill(null);
  for(let i=0;i<CELLS;i++){const c=document.createElement('div');c.className='cell';board.appendChild(c);cellEls.push(c);}
  layout();
  state.cells.forEach((lv,i)=>{if(lv)makeFrogEl(i,lv,false);});
}
function layout(){
  const w=board.clientWidth;cs=(w-PAD*2-GAP*(N-1))/N;
  board.style.setProperty('--cs',cs+'px');
  cellEls.forEach((c,i)=>{const [x,y]=cellXY(i);c.style.left=x+'px';c.style.top=y+'px';c.style.width=cs+'px';c.style.height=cs+'px';});
  els.forEach((el,i)=>el&&position(el,i));
}
function position(el,i){const [x,y]=cellXY(i);el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');}
function makeFrogEl(i,lv,pop=true){
  const el=document.createElement('div');el.className='frog'+(pop?' pop':'')+(lv===WILD?' wild':'')+(isJunk(lv)?' junk':'');
  el.innerHTML=`<img alt=""><span class="lvl">${lv===WILD?ic('sparkle'):lv}</span>`;
  const img=el.firstChild;if(thumbs.has(lv))img.src=thumbs.get(lv);else thumb(lv).then(u=>img.src=u);
  el.style.transition='none';position(el,i);board.appendChild(el);void el.offsetWidth;el.style.transition='';
  els[i]=el;setTimeout(()=>{el.classList.remove('pop');el.classList.add('idle');el.querySelector('img').style.animationDelay=(-Math.random()*2.6)+'s';},520);
  return el;
}
function refreshJunk(){els.forEach((el,i)=>{if(el)el.classList.toggle('junk',isJunk(state.cells[i]));});}
function cellCenter(i){const r=board.getBoundingClientRect();const [x,y]=cellXY(i);return [r.left+x+cs/2,r.top+y+cs/2];}
function cellAt(clientX,clientY){const r=board.getBoundingClientRect();const x=clientX-r.left-PAD,y=clientY-r.top-PAD;if(x<0||y<0)return -1;const c=Math.floor(x/(cs+GAP)),rr=Math.floor(y/(cs+GAP));if(c<0||c>=N||rr<0||rr>=N)return -1;return rr*N+c;}

/* line finding: any window of 3 in a row/col where non-wild frogs match */
// последний уровень не сливается дальше: 51-й лягушки не существует, слияние сломало бы сохранение
function windowLevel(idx){const c=state.cells;let lv=null;for(const i of idx){const v=c[i];if(!v)return null;if(v===WILD)continue;if(lv===null)lv=v;else if(lv!==v)return null;}return lv>=LEVELS.length?null:lv;}
function findLine(focus){
  const wins=[];
  for(let r=0;r<N;r++)for(let x=0;x<=N-3;x++){const idx=[r*N+x,r*N+x+1,r*N+x+2];const lv=windowLevel(idx);if(lv)wins.push({idx,lv});}
  for(let col=0;col<N;col++)for(let y=0;y<=N-3;y++){const idx=[y*N+col,(y+1)*N+col,(y+2)*N+col];const lv=windowLevel(idx);if(lv)wins.push({idx,lv});}
  if(!wins.length)return null;
  const w=wins.find(w=>w.idx.includes(focus))||wins[0];
  return {win:w.idx,lv:w.lv,target:w.idx.includes(focus)?focus:w.idx[1]};
}
let busy=false;
async function mergeCells(win,lv,target,combo){
  for(const i of win){if(i!==target&&els[i]){els[i].classList.add('merging');position(els[i],target);}}
  win.forEach(i=>state.cells[i]=0);
  await wait(230);
  for(const i of win){if(els[i]){els[i].remove();els[i]=null;}}
  const nl=lv+1;state.cells[target]=nl;makeFrogEl(target,nl);state.merges++;state.score+=nl;
  const [x,y]=cellCenter(target);
  sparks(x,y,14,['#ffd23f','#9dffb0','#fff','#7fe3ff']);
  S.merge(combo,nl);haptic.heavy();fullPlay();
  const reward=mergeReward(nl,combo);addCoins(reward);
  floatText(x,y-cs*.4,(combo>1?'x'+combo+' КОМБО  ':'')+'+'+fmt(reward),'big');
  if(nl>state.maxLv){await levelUp(nl);}
  if(nl<LEVELS.length)thumb(nl+1).catch(()=>{});
}
async function resolve(focus){
  busy=true;
  try{
    let combo=0,line;
    while((line=findLine(focus))){combo++;await mergeCells(line.win,line.lv,line.target,combo);focus=line.target;await wait(140);}
  }catch(e){
    console.error('resolve',e);
    toast('Что-то не догрузилось, но прогресс сохранён');
  }finally{
    // без finally одна сетевая ошибка вешала игру намертво
    busy=false;refreshJunk();save();updateHud();
  }
}

/* drag & drop */
let drag=null,selected=-1;
function setSelected(i){if(selected>=0&&els[selected])els[selected].classList.remove('selected');selected=i;if(i>=0&&els[i])els[i].classList.add('selected');renderActions();}
function clearHl(){cellEls.forEach(c=>c.classList.remove('hl'));$('#clicker').classList.remove('feed');}
board.addEventListener('pointerdown',e=>{
  if(busy)return;audio();
  const i=cellAt(e.clientX,e.clientY);if(i<0)return;
  if(state.cells[i]){drag={from:i,x0:e.clientX,y0:e.clientY,moving:false,over:i};try{board.setPointerCapture(e.pointerId);}catch(err){}}
  else if(selected>=0){moveFrog(selected,i);setSelected(-1);}
});
board.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moving){if(Math.hypot(dx,dy)<6)return;drag.moving=true;setSelected(-1);els[drag.from].classList.add('dragging');S.ui();}
  const el=els[drag.from];const [x,y]=cellXY(drag.from);
  el.style.setProperty('--x',(x+dx)+'px');el.style.setProperty('--y',(y+dy)+'px');
  const over=cellAt(e.clientX,e.clientY);

// в покое лягушка стоит статичным кадром (loop:false, autoplay:false, застыла на кадре 0).
// тап проигрывает только короткий кусок анимации один раз и возвращает её обратно на кадр 0 —
// без глобального loop:true тут нечему зациклиться само по себе.
let clickerAnim=null,bounceT=null;
// слияние — событие крупное, тут лягушка отыгрывает свою анимацию целиком
// animLock защищает длинную анимацию слияния от того, чтобы её сбил обычный тап —
// без него достаточно ткнуть вторым пальцем, и слияние доигрывается как короткий тап
let animLock=0,clipFrames=60,clipFps=60;
function fullPlay(){
  if(!clickerAnim)return;
  const ms=(clipFrames/clipFps)*1000;
  clearTimeout(bounceT);
  animLock=now()+ms;
  clickerAnim.playSegments([0,clipFrames],true);
  bounceT=setTimeout(()=>{animLock=0;if(clickerAnim)clickerAnim.goToAndStop(0,true);},ms+40);
}
let lastBounce=0;
function tapBounce(){
  if(!clickerAnim)return;
  const t=now();
  if(t<animLock)return;      // идёт слияние — не перебиваем
  if(t-lastBounce<45)return; // два пальца в один момент: одного рывка достаточно
  lastBounce=t;
  const end=Math.max(6,Math.round(clipFrames*0.2));
  clearTimeout(bounceT);
  clickerAnim.playSegments([0,end],true);
  bounceT=setTimeout(()=>{if(clickerAnim)clickerAnim.goToAndStop(0,true);},(end/clipFps)*1000+20);
}
async function setClickerSkin(lv){

  clipFps=data.fr||60;
  if(clickerAnim){clickerAnim.destroy();clickerAnim=null;}
  $('#clickerLottie').innerHTML='';
  clickerAnim=lottie.loadAnimation({container:$('#clickerLottie'),renderer:'svg',loop:false,autoplay:false,animationData:data,rendererSettings:{preserveAspectRatio:'xMidYMid meet',progressiveLoad:false}});
  clickerAnim.addEventListener('DOMLoaded',()=>clickerAnim&&clickerAnim.goToAndStop(0,true));

function tap(e){
  audio();

  const mult=Math.min(3,1+Math.floor(streak/12));

function mix(hex,to,k){
  const h=x=>parseInt(hex.slice(1+x*2,3+x*2),16),g=x=>parseInt(to.slice(1+x*2,3+x*2),16);
  const v=x=>Math.round(h(x)+(g(x)-h(x))*k).toString(16).padStart(2,'0');
  return '#'+v(0)+v(1)+v(2);
}
function applyTheme(){
  const app=$('#app'),st=app.style;
  ['--bg1','--bg2','--bg3','--card1','--card2'].forEach(v=>st.removeProperty(v));
  const name=state.theme;
  if(!name||!(state.inv.themes||[]).includes(name))return;
  const c=bdColors(name);if(!c)return;
  st.setProperty('--bg1',c.c);
  st.setProperty('--bg2',mix(c.c,c.e,.65));
  st.setProperty('--bg3',mix(c.e,'#000000',.45));
  st.setProperty('--card1',mix(c.c,c.e,.4));
  st.setProperty('--card2',mix(c.e,'#000000',.25));
}
const timeLeft=ms=>{const s=Math.max(0,ms)/1000;if(s>=86400)return Math.ceil(s/86400)+' д';if(s>=3600)return Math.ceil(s/3600)+' ч';return Math.max(1,Math.ceil(s/60))+' мин';};
function shopHeader(){
  const perTap=tapValue(), perHour=Math.round(perTap*3600*0.5);   // ~2 тапа в секунду вполсилы
  const parts=[`Сейчас <b>${fmt(perTap)}</b> за тап`];
  if(autoOn())parts.push('мушка работает');
  if(boostMult()>1)parts.push('ускорение ×2');
  return parts.join(' · ')+`<br><span class="muted">мушка приносит примерно ${fmt(Math.round(perTap*3600))} монет за час без единого тапа</span>`;
}
// подсказка ровно в тот момент, когда игрок упёрся — это уместно, а не назойливо
function contextOffer(){
  const inv=state.inv,full=state.cells.filter(Boolean).length===CELLS;
  if(full&&!canMergeAny()&&!state.wild)return {id:'wild3',why:'Поле встало намертво — дикая лягушка расчистит'};
  if(full&&!inv.bigBoard)return {id:'bigBoard',why:'Поле забито. На 6×6 такое почти не случается'};
  if(!inv.starter&&!inv.autoForever&&state.maxLv>=3)return {id:'starter',why:'Самый выгодный набор на старте'};
  if(!autoOn())return {id:'auto1d',why:'Устал тапать? Мушка сделает это за тебя'};
  return null;
}
function itemCard(it,inv,t,extra){
  const d=document.createElement('div');d.className='item'+(it.donate?' donate':'');
  const icon=it.icon==='wild'?(thumbs.get(WILD)||''):it.icon;
  const bc=it.backdrop&&bdColors(it.backdrop);
  let btn='',status='';
  if(it.donate)btn='';
  else if(it.once&&inv[it.once])btn='<button class="buy owned">Есть</button>';
  else if(it.backdrop&&(inv.themes||[]).includes(it.backdrop))btn=`<button class="buy ${state.theme===it.backdrop?'owned':''}" data-theme="${esc(it.backdrop)}">${state.theme===it.backdrop?'Включён':'Включить'}</button>`;
  else if(it.id==='sub'&&(inv.subUntil||0)>t)btn=`<button class="buy time">${timeLeft(inv.subUntil-t)}</button>`;
  else btn=`<button class="buy" data-buy="${it.id}">${it.price} <img class="ic" src="icons/tgstar.png" alt=""></button>`;
  if(it.id==='auto1d'&&autoOn()&&!inv.autoForever)status=`активна ещё ${timeLeft(Math.max(inv.autoUntil||0,inv.subUntil||0)-t)}`;
  if(it.id.startsWith('boost')&&boostMult()>1)status=`активно ещё ${timeLeft(inv.boostUntil-t)}`;
  if(it.id==='wild3'&&state.wild>0)status=`в запасе ×${state.wild}`;
  const badge=it.badge?`<i class="badge2">${it.badge}</i>`:'';
  const was=it.was?`<s>${it.was}</s> `:'';
  const chev=it.bundle?`<i class="chev">Из чего набор ▾</i>`:'';
  d.innerHTML=
    (bc?`<i class="bdview" style="background:radial-gradient(circle at 40% 32%, ${bc.c}, ${bc.e})"></i>`:`<img src="${icon}" alt="">`)+
    `<div><b>${it.name}${badge}</b><span>${extra||it.desc}</span>${status?`<span class="live">${status}</span>`:''}${chev}`+
    (it.donate?`<div class="row">${it.prices.map(p=>`<button class="buy" data-buy="donate" data-amount="${p}">${p} <img class="ic" src="icons/tgstar.png" alt=""></button>`).join('')}</div>`:'')+
    `</div>`+
    (was&&!inv[it.once]?`<div class="pricebox">${was}${btn}</div>`:btn);
  // разворачиваемая расшифровка — по тапу на карточку показываем, из чего набор
  // и сколько это стоило бы отдельными покупками, чтобы скидка была осязаемой, а не просто цифрой
  if(it.bundle){
    d.classList.add('expandable');
    const total=it.bundle.reduce((s,x)=>s+x[2],0);
    const detail=document.createElement('div');detail.className='bundle';detail.hidden=true;
    detail.innerHTML=it.bundle.map(([ic,label,price])=>{
      const img=ic==='wild'?(thumbs.get(WILD)||''):ic;
      return `<div class="bundle-row"><img src="${img}" alt=""><span>${label}</span><b>${price}<img class="ic" src="icons/tgstar.png" alt=""></b></div>`;
    }).join('')+`<div class="bundle-total">По отдельности вышло бы <s>${total}</s> — в наборе ${it.price} <img class="ic" src="icons/tgstar.png" alt=""></div>`;
    d.appendChild(detail);
    const chevEl=d.querySelector('.chev');
    d.addEventListener('click',e=>{
      if(e.target.closest('button'))return;
      const open=detail.hidden;detail.hidden=!open;d.classList.toggle('open',open);
      chevEl.textContent=open?'Из чего набор ▴':'Из чего набор ▾';
      S.ui();
    });
  }
  return d;
}
function renderShop(){
  const l=$('#shopList');l.innerHTML='';const inv=state.inv,t=now();
  $('#shopNote').innerHTML=inTG?(net.online?shopHeader():'Сервер не отвечает, покупки недоступны'):shopHeader()+'<br><span class="muted">демо-режим: покупки бесплатны</span>';

  const owned=(net.holder&&net.holder.frogs)||[];
  const bdItems=[...new Map(owned.filter(f=>f.backdrop).map(f=>[f.backdrop,f])).values()].map(f=>({
    id:'bd:'+f.backdrop,g:'skin',name:'Фон «'+f.backdrop+'»',
    desc:'С твоей '+f.model+(f.number?' #'+f.number:''),
    price:BD_PRICE,icon:'icons/ticket-blue.png',backdrop:f.backdrop}));
  const all=[...SHOP,...bdItems];

  // 1. предложение под текущую боль — сверху и с объяснением, почему именно оно
  const off=contextOffer();
  if(off){
    const it=all.find(x=>x.id===off.id);
    if(it&&!(it.once&&inv[it.once])){
      const wrap=document.createElement('div');wrap.className='offer';
      wrap.innerHTML='<div class="offer-t">Пригодится прямо сейчас</div>';
      wrap.appendChild(itemCard(it,inv,t,off.why));
      l.appendChild(wrap);
    }
  }
  // 2. остальное по группам, чтобы взгляд не тонул в списке
  GROUPS.forEach(([g,title])=>{
    const items=all.filter(x=>x.g===g&&!(x.id===(off&&off.id)));
    if(!items.length)return;
    if(title){const h=document.createElement('div');h.className='shop-h';h.textContent=title;l.appendChild(h);}
    items.forEach(it=>l.appendChild(itemCard(it,inv,t)));
  });
  if(!bdItems.length){
    const h=document.createElement('div');h.className='shop-h';h.textContent='Фоны твоих лягушек';l.appendChild(h);
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<i class="bdview" style="background:radial-gradient(circle at 40% 32%, #2f6b4f, #14301f)"></i>`+
      `<div><b>Фон твоей лягушки</b><span>${net.online?'Появится лягушка в профиле — её фон появится здесь':'Видны, когда игра открыта в Telegram'}</span></div>`+
      `<button class="buy" data-chat="1">Где взять</button>`;
    l.appendChild(d);
  }
  l.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{S.ui();openTg(CFG.chat);});
  l.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy,Number(b.dataset.amount||0)));
  l.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;applyTheme();save();renderShop();S.ui();});
}
async function buy(id,amount){
  const it=SHOP.find(i=>i.id===id)||(id.startsWith('bd:')?{id,price:BD_PRICE}:null);if(!it)return;
  S.ui();
  if(inTG&&CFG.api){
    if(!net.online){await sync(true);if(!net.online){toast('Сервер не отвечает');return;}}
    try{
      const r=await api('invoice',{item:id,amount});
      if(!r.link){toast(r.error||'Не удалось создать счёт');return;}
      TG.openInvoice(r.link,async status=>{
        if(status==='paid'){S.buy();haptic.success();toast('Оплачено');await wait(800);await sync(true);renderShop();}
        else if(status==='failed')toast('Оплата не прошла');
      });
    }catch(e){toast('Ошибка сервера');}
    return;
  }
  grantLocal(id,amount);save();S.buy();haptic.success();toast(id==='donate'?`Спасибо! Пруд накормлен на ${amount} звёзд (демо)`:'Куплено (демо-режим)');renderShop();
}
function openShop(hl){renderShop();$('#shop').classList.remove('hidden');if(hl){const b=$('#shopList').querySelector(`[data-buy="${hl}"]`);b&&b.closest('.item').scrollIntoView({block:'center'});}}
$('#btnShop').onclick=()=>{S.ui();openShop();};
$('#shopClose').onclick=()=>{$('#shop').classList.add('hidden');S.ui();};

/* ---------- LEADERBOARD ---------- */
const DEMO_TOP=[['Puddles',37,18420],['Frogmaid',31,12950],['Tesla Frog',28,9800],['Ms. Toad',22,6100],['Cupid',19,4400],['Melon',13,1900],['Peach',8,740]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function openTop(){
  $('#top').classList.remove('hidden');S.ui();
  const list=$('#topList');list.innerHTML='<div class="demo">Загрузка…</div>';
  await sync(true);
  let rows,note='';
  if(net.online){rows=net.top;note=net.me?`Твоё место: ${net.me.rank} · очки пруда ${fmt(net.me.score)}`:'';}
  else{
    rows=DEMO_TOP.map((d,i)=>({rank:i+1,name:d[0]+' (пример)',maxLv:LEVELS.findIndex(l=>l.n===d[0])+1,score:d[2],holder:i<3?d[0]:null}));
    rows.push({rank:0,name:myName,maxLv:state.maxLv,score:state.score,me:true});
    rows.sort((a,b)=>b.score-a.score).forEach((r,i)=>r.rank=i+1);
    note='Пример таблицы. Настоящий лидерборд появится, когда игра запущена в Telegram с сервером.';
  }
  const pond=net.pond;const pct=Math.min(100,pond.count/pond.goal*100);
  $('#pondTxt').textContent=`${fmt(pond.count)} / ${fmt(pond.goal)} слияний`;$('#pondBar').style.width=pct+'%';
  list.innerHTML='';
  const meId=net.me?net.me.id:null;
  rows.forEach(r=>{
    const d=document.createElement('div');d.className='lb'+((r.me||(meId&&r.id===meId))?' me':'');
    const medal=r.rank<=3?ic('medal','m'+r.rank):r.rank;
    const lv=Math.max(1,Math.min(r.maxLv||1,LEVELS.length));
    d.innerHTML=`<div class="rk ${r.rank<=3?'top':''}">${medal}</div><img alt=""><div class="nm">${esc(r.name||'Игрок')}${r.holder?'<span class="badge">'+ic('crown')+' хозяин</span>':''}${r.sub?'<span class="badge" style="background:#ffd23f;color:#5a3b00">абонент</span>':''}<small>${frogName(lv)} · ур. ${lv}</small></div><div class="sc">${fmt(r.score||0)}</div>`;
    thumb(lv).then(u=>d.querySelector('img').src=u);
    list.appendChild(d);
  });
  $('#topNote').textContent=note;
}
$('#btnTop').onclick=openTop;
$('#topClose').onclick=()=>{$('#top').classList.add('hidden');S.ui();};
$('#topShare').onclick=()=>share('chat',state.maxLv);
$('#btnChat').onclick=()=>{S.ui();openTg(CFG.chat);};

/* ---------- COLLECTION ---------- */
const isHolder=()=>!!((net.holder&&net.holder.frogs||[]).length);
function openCollection(){
  $('#btnHolders').hidden=!isHolder();
  const g=$('#colGrid');g.innerHTML='';

$('#btnCol').onclick=openCollection;
$('#colClose').onclick=()=>{$('#collection').classList.add('hidden');S.ui();};
// нативные confirm/TG.showConfirm недоступны в части клиентов, поэтому спрашиваем сами
let askCb=null;

$('#btnHolders').onclick=()=>{S.ui();openTg(CFG.holders);};

$('#btnSound').onclick=()=>{state.sound=!state.sound;save();updateHud();S.ui();};

/* ---------- INIT ---------- */
async function init(){
  // стикер на загрузочном экране показываем первым делом, чтобы не смотреть в пустоту
  loadFrogData('loader').then(d=>{
    if($('#loading').classList.contains('hidden'))return;
    lottie.loadAnimation({container:$('#loadFrog'),renderer:'svg',loop:true,autoplay:true,animationData:d});
  }).catch(()=>{});
  await load();
  const need=new Set([WILD,1,...state.cells.filter(v=>v>0),state.maxLv,state.maxLv+1]);
  for(let l=baseSpawnLv();l<=state.maxLv+1;l++)need.add(l);
  const list=[...need].filter(l=>l===WILD||l<=LEVELS.length);let done=0;
  await Promise.all(list.map(l=>thumb(l).then(()=>{done++;$('#loadBar').style.width=(done/list.length*100)+'%';})));
  $('#spawnIcon').src=thumbs.get(WILD);
  buildBoard();applyTheme();
  await setClickerSkin(state.maxLv);
  updateHud();
  $('#loading').classList.add('hidden');
  resolve(-1);
  if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param==='shop')openShop();
  sync(true).then(r=>{
    const frogs=(r&&r.holder&&r.holder.frogs)||[];
    // тихое уведомление без модалки и без намёка на то, что ждёт в конце игры —
    // человек только открыл приложение, спойлерить финал ему рано
    if(frogs.length&&!state.inv.holderShown){
      state.inv.holderShown=true;save();
      toast(frogs.length>1?'Нашли твои лягушки в подарках — открыт чат холдеров':'Нашли твою лягушку в подарках — открыт чат холдеров',3200);
    }
  });
  setInterval(()=>sync(false),30000);
}

if(TG){try{TG.onEvent('viewportChanged',layout);TG.onEvent('safeAreaChanged',layout);TG.onEvent('contentSafeAreaChanged',layout);TG.onEvent('fullscreenChanged',layout);}catch(e){}}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();sync(true);}});
window.__frog={state,spawn,resolve,thumbs,grantLocal,net,renderCard,placeWild,share,openTop,openShop,applyOwnership,buildOrder,applyOrder,ownsLevel,LEVELS,BASE,renderShop,ask,buildBoard};
init().catch(e=>{console.error(e);$('#loading h2').textContent='Ошибка загрузки: '+e.message;});
})();
