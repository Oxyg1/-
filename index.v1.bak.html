<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3527">
<title>Frog Merge</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="levels.js"></script>
<style>
:root{
  --acc:#ffd23f; --acc2:#f5a800; --acc-dark:#a86f00;
  --txt:#fff; --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-weight:800;
  background:radial-gradient(130% 70% at 50% -10%,#3aa373 0%,#1b6b4a 40%,#0c3a2a 100%);
  color:var(--txt);touch-action:manipulation;
}
#app{height:100dvh;height:var(--tg-viewport-stable-height,100dvh);display:flex;flex-direction:column;gap:8px;
  padding:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 8px) 12px calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + 10px)}

/* HUD */
.hud{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.3);border-radius:999px;padding:3px 14px 3px 4px;font-weight:900;font-size:19px;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.25);white-space:nowrap}
.pill img{width:32px;height:32px}
.pill.coins{flex:1;min-width:0}
.pill.coins span{overflow:hidden;text-overflow:ellipsis}
.pill.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.12)}}
.iconbtn{width:44px;height:44px;border:0;border-radius:14px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;padding:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.1),0 3px 8px rgba(0,0,0,.25)}
.iconbtn img{width:34px;height:34px}
.iconbtn:active{transform:scale(.92)}

#hint{text-align:center;font-size:15px;min-height:20px;opacity:.9;transition:opacity .3s}
#hint.hide{opacity:0}

/* BOARD */
.board-wrap{display:flex;justify-content:center}
#board{position:relative;width:min(100%,calc(100dvh - 350px));min-width:240px;aspect-ratio:1;border-radius:22px;background:rgba(0,0,0,.25);box-shadow:inset 0 4px 14px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.06);touch-action:none}
.cell{position:absolute;border-radius:16px;background:rgba(255,255,255,.09);box-shadow:inset 0 2px 0 rgba(255,255,255,.06);transition:background .15s,box-shadow .15s}
.cell.hl{background:rgba(255,210,63,.35);box-shadow:inset 0 0 0 3px var(--acc)}
.frog{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);transform:translate(var(--x),var(--y));transition:transform .2s cubic-bezier(.2,.8,.2,1.15);will-change:transform;display:flex;align-items:center;justify-content:center;pointer-events:none}
.frog img{width:96%;height:96%;object-fit:contain;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));transform-origin:50% 90%}
.frog .lvl{position:absolute;right:3px;bottom:2px;font-size:11px;font-weight:900;line-height:16px;background:rgba(0,0,0,.5);border-radius:8px;padding:0 5px;color:#ffe680}
.frog.selected img{animation:wiggle .45s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg) scale(1.06)}50%{transform:rotate(6deg) scale(1.06)}}
.frog.dragging{transition:none;z-index:20}
.frog.dragging img{transform:scale(1.18);filter:drop-shadow(0 12px 10px rgba(0,0,0,.45))}
.frog.pop img{animation:pop .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.frog.merging{transition:transform .22s cubic-bezier(.5,0,.8,.4);z-index:5}
.frog.merging img{transform:scale(.6);opacity:.8}
.frog.idle img{animation:idle 2.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.03)}}
.frog.eaten{transition:transform .25s cubic-bezier(.5,0,.9,.4),opacity .25s;opacity:0}

/* CLICKER */
.clicker-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:0;position:relative}
#combo{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;transform:translateY(-4px)}
#combo.on{opacity:1}
#combo .cb{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 12px 3px 6px;font-size:16px;font-weight:900;color:#ffd23f}
#combo img{width:24px;height:24px}
#clicker{flex:1;min-height:120px;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative;border-radius:24px;transition:background .15s}
#clicker.feed{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 3px rgba(255,210,63,.6)}
#clicker::before{content:"";position:absolute;left:50%;bottom:6%;width:46%;height:8%;transform:translateX(-50%);background:rgba(0,0,0,.28);border-radius:50%;filter:blur(4px)}
#clickerLottie{height:100%;aspect-ratio:1;max-height:230px;transition:transform .09s cubic-bezier(.2,.8,.2,1);position:relative;transform-origin:50% 92%}
#clickerLottie svg{display:block}
#clickerLottie.squash{transform:scale(1.1,.88)}
#frogName{font-size:17px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px}
#frogName small{font-size:13px;opacity:.8;font-weight:800}

#btnSpawn{width:100%;max-width:380px;border:0;border-radius:24px;padding:9px 14px 9px 9px;background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;font:900 20px/1 Nunito,system-ui;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 var(--acc-dark),0 12px 18px rgba(0,0,0,.35);transition:transform .07s,box-shadow .07s,filter .2s;touch-action:none}
#btnSpawn img.fr{width:44px;height:44px;background:rgba(255,255,255,.35);border-radius:14px}
#btnSpawn .cost{display:flex;align-items:center;gap:4px;background:rgba(90,59,0,.15);border-radius:999px;padding:4px 10px 4px 5px;font-size:17px}
#btnSpawn .cost img{width:22px;height:22px}
#btnSpawn.down,#btnSpawn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-dark),0 4px 8px rgba(0,0,0,.35)}
#btnSpawn.poor{filter:grayscale(.55) brightness(.85)}
#btnSpawn.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* FX */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 10px rgba(0,0,0,.4);animation:floatUp .85s cubic-bezier(.1,.7,.3,1) forwards;transform:translate(-50%,-50%);white-space:nowrap}
.float.crit{color:#ffd23f;font-size:32px;animation-duration:1.1s}
.float.big{color:#9dffb0;font-size:26px}
@keyframes floatUp{to{transform:translate(-50%,-160%) scale(1.1);opacity:0}}
.coinp{position:absolute;width:26px;height:26px;transform:translate(-50%,-50%);animation:coinp .7s cubic-bezier(.2,.7,.3,1) forwards}
.coinp img{width:100%;height:100%}
@keyframes coinp{0%{transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.9) rotate(var(--r));opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--c,#fff);transform:translate(-50%,-50%);animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0}}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0);background:rgba(0,0,0,.7);border-radius:16px;padding:10px 16px;font-size:16px;opacity:0;transition:opacity .25s,transform .25s;z-index:60;pointer-events:none;text-align:center;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,-8px)}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(3,25,17,.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.hidden{display:none}
.card{background:linear-gradient(#2a8a5e,#155a3d);border-radius:28px;padding:20px 18px;width:100%;max-width:380px;max-height:92dvh;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.15);position:relative;overflow:hidden;animation:cardIn .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cardIn{from{transform:scale(.6);opacity:0}}
.card h2{margin:0;font-size:26px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .sub{opacity:.85;font-size:15px}
#luLottie{width:220px;height:220px}
#luName{font-size:24px;color:#ffd23f;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#luLv{display:flex;align-items:center;gap:6px;font-size:18px}
#luLv img{width:26px;height:26px}
.btn{border:0;border-radius:18px;padding:12px 28px;background:linear-gradient(#ffe36b,#f7b500);color:#5a3b00;font:900 19px Nunito,system-ui;box-shadow:0 5px 0 var(--acc-dark);margin-top:6px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--acc-dark)}
.btn.ghost{background:rgba(0,0,0,.3);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.4);font-size:15px;padding:9px 18px}
.conf{position:absolute;width:10px;height:14px;top:-20px;background:var(--c);animation:conf 2.2s linear infinite;border-radius:2px}
@keyframes conf{to{transform:translateY(120vh) rotate(720deg)}}

#colGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;overflow:auto;padding:4px;flex:1;min-height:0}
.slot{aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px;gap:2px;position:relative}
.slot img{width:70%;height:70%;object-fit:contain}
.slot.locked{opacity:.55}
.slot.locked img{filter:brightness(0) opacity(.5)}
.slot .n{position:absolute;top:2px;left:6px;font-size:10px;color:#ffe680}
.slot.cur{box-shadow:inset 0 0 0 3px var(--acc)}
.colhead{display:flex;align-items:center;justify-content:space-between;width:100%}
.colhead h2{font-size:22px}

#loading .card{align-items:center}
#loading .bar{width:100%;height:12px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill coins" id="coinPill"><img src="icons/coin.png" alt=""><span id="coins">0</span></div>
    <div class="pill lv"><img src="icons/lv.png" alt=""><span id="lv">1</span></div>
    <button class="iconbtn" id="btnCol" title="Коллекция"><img src="icons/ticket-green.png" alt=""></button>
    <button class="iconbtn" id="btnSound" title="Звук">🔊</button>
  </div>
  <div id="hint"></div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="clicker-area">
    <div id="combo"><div class="cb"><img src="icons/fire.png" alt=""><span id="comboTxt">x2</span></div></div>
    <div id="clicker"><div id="clickerLottie"></div></div>
    <div id="frogName"></div>
    <button id="btnSpawn"><img class="fr" id="spawnIcon" alt=""><span>Призвать</span><span class="cost"><img src="icons/coin.png" alt=""><b id="cost">6</b></span></button>
  </div>
</div>
<div id="fx"></div>
<div id="toast"></div>

<div id="levelup" class="overlay hidden">
  <div class="card">
    <h2>Новая лягушка!</h2>
    <div class="sub">Скин кликера обновлён</div>
    <div id="luLottie"></div>
    <div id="luName"></div>
    <div id="luLv"><img src="icons/lv.png" alt="">Уровень <b id="luLvN"></b></div>
    <button class="btn" id="luOk">Круто!</button>
  </div>
</div>

<div id="collection" class="overlay hidden">
  <div class="card" style="height:92dvh">
    <div class="colhead"><h2>Коллекция <span id="colCount"></span></h2><button class="iconbtn" id="colClose">✕</button></div>
    <div id="colGrid"></div>
    <button class="btn ghost" id="btnReset">Сбросить прогресс</button>
  </div>
</div>

<div id="loading" class="overlay">
  <div class="card">
    <h2>🐸 Лягушки просыпаются…</h2>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<script>
(()=>{
'use strict';
const N=5, CELLS=N*N, GAP=5, PAD=7, SAVE_KEY='frogmerge.v1', THUMB_FRAME=0;
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- TELEGRAM ---------- */
const TG=(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!==undefined)?window.Telegram.WebApp:null;
const tgv=v=>{if(!TG||!TG.version)return false;const [a,b]=TG.version.split('.').map(Number),[c,d]=v.split('.').map(Number);return a>c||(a===c&&b>=d);};
if(TG){
  try{TG.ready();TG.expand();}catch(e){}
  try{TG.setHeaderColor('#0c3a2a');TG.setBackgroundColor('#0c3a2a');if(tgv('7.10'))TG.setBottomBarColor('#0c3a2a');}catch(e){}
  try{if(tgv('7.7'))TG.disableVerticalSwipes();}catch(e){}
  try{if(tgv('6.2'))TG.enableClosingConfirmation();}catch(e){}
}
const haptic={
  light:()=>{try{TG?TG.HapticFeedback.impactOccurred('light'):navigator.vibrate&&navigator.vibrate(8);}catch(e){}},
  medium:()=>{try{TG?TG.HapticFeedback.impactOccurred('medium'):navigator.vibrate&&navigator.vibrate(20);}catch(e){}},
  heavy:()=>{try{TG?TG.HapticFeedback.impactOccurred('heavy'):navigator.vibrate&&navigator.vibrate([20,30,40]);}catch(e){}},
  success:()=>{try{TG?TG.HapticFeedback.notificationOccurred('success'):navigator.vibrate&&navigator.vibrate([30,40,30,40,80]);}catch(e){}},
  error:()=>{try{TG?TG.HapticFeedback.notificationOccurred('error'):navigator.vibrate&&navigator.vibrate(40);}catch(e){}},
  select:()=>{try{TG?TG.HapticFeedback.selectionChanged():navigator.vibrate&&navigator.vibrate(6);}catch(e){}},
};

/* ---------- STATE ---------- */
const state={coins:0,maxLv:1,cells:Array(CELLS).fill(0),disc:[1],sound:true,merges:0,t:0};
function applySave(s){if(s&&Array.isArray(s.cells)&&s.cells.length===CELLS&&(s.t||0)>=(state.t||0))Object.assign(state,s);}
const cloudOk=()=>TG&&tgv('6.9')&&TG.CloudStorage;
async function load(){
  try{applySave(JSON.parse(localStorage.getItem(SAVE_KEY)));}catch(e){}
  if(cloudOk()){
    try{const v=await Promise.race([new Promise((res,rej)=>TG.CloudStorage.getItem(SAVE_KEY,(err,val)=>err?rej(err):res(val))),wait(2500).then(()=>null)]);if(v)applySave(JSON.parse(v));}catch(e){}
  }
}
let saveT=null,resetting=false;
function save(){
  if(resetting)return;
  state.t=Date.now();
  const json=JSON.stringify(state);
  try{localStorage.setItem(SAVE_KEY,json);}catch(e){}
  if(cloudOk()){clearTimeout(saveT);saveT=setTimeout(()=>{try{TG.CloudStorage.setItem(SAVE_KEY,json,()=>{});}catch(e){}},800);}
}

/* ---------- ECONOMY ---------- */
const tapValue=()=>Math.ceil(Math.pow(1.5,state.maxLv-1));
const baseSpawnLv=()=>Math.max(1,state.maxLv-2);
const spawnCapLv=()=>Math.max(1,state.maxLv-1);
function nice(n){n=Math.max(1,Math.round(n));if(n<30)return n;const p=Math.pow(10,Math.floor(Math.log10(n))-1);return Math.round(n/p)*p;}
const spawnCost=()=>nice(tapValue()*(5+state.maxLv*0.4));
function rollSpawnLevel(){const b=baseSpawnLv(),r=Math.random();const lv=r<.6?b:r<.9?b+1:b+2;return Math.min(lv,spawnCapLv());}
const mergeReward=(newLv,combo)=>nice(spawnCost()*0.4*Math.pow(1.5,newLv-baseSpawnLv()-1)*combo);
const feedReward=lv=>nice(spawnCost()*0.35*Math.pow(2.6,lv-baseSpawnLv()));
function fmt(n){if(n<1000)return String(Math.round(n));const u=['K','M','B','T','q','Q'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++;}return (n<10?n.toFixed(1):n<100?n.toFixed(1):Math.round(n))+u[i];}

/* ---------- ASSETS ---------- */
const frogFile=lv=>lv===0?'original':LEVELS[lv-1].f;
const frogName=lv=>lv===0?'Original':LEVELS[lv-1].n;
const dataCache=new Map();
function loadFrogData(lv){
  if(!dataCache.has(lv)){
    dataCache.set(lv,(async()=>{
      let bytes;
      const f=frogFile(lv);
      if(window.EMBED&&window.EMBED[f]){const b=atob(EMBED[f]);bytes=new Uint8Array(b.length);for(let i=0;i<b.length;i++)bytes[i]=b.charCodeAt(i);}
      else{const r=await fetch('frogs/'+f+'.tgs');if(!r.ok)throw new Error('load '+f);bytes=new Uint8Array(await r.arrayBuffer());}
      let text;
      if(window.DecompressionStream){try{const s=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));text=await new Response(s).text();}catch(e){text=null;}}
      if(!text)text=pako.ungzip(bytes,{to:'string'});
      return JSON.parse(text);
    })());
  }
  return dataCache.get(lv);
}
const thumbs=new Map(), thumbPromises=new Map();
function thumb(lv){
  if(thumbPromises.has(lv))return thumbPromises.get(lv);
  const p=(async()=>{
    const data=structuredClone(await loadFrogData(lv));
    const c=document.createElement('canvas');c.width=c.height=256;
    const anim=lottie.loadAnimation({renderer:'canvas',loop:false,autoplay:false,animationData:data,rendererSettings:{context:c.getContext('2d'),clearCanvas:true,preserveAspectRatio:'xMidYMid meet'}});
    await new Promise(r=>{anim.addEventListener('DOMLoaded',r);setTimeout(r,400);});
    anim.goToAndStop(THUMB_FRAME,true);
    const url=c.toDataURL('image/png');anim.destroy();thumbs.set(lv,url);return url;
  })();
  thumbPromises.set(lv,p);return p;
}

/* ---------- SOUND ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f0,f1,dur,type='sine',vol=.18,t0=0){const a=audio();if(!a||!state.sound)return;const t=a.currentTime+t0;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
const S={
  pop:c=>c?(tone(700,1400,.15,'square',.12),tone(1000,2000,.2,'sine',.15,.03)):tone(520+Math.random()*80,260,.09,'sine',.16),
  spawn:()=>{tone(300,700,.12,'triangle',.14);tone(600,900,.1,'sine',.1,.06);},
  merge:c=>{const b=1+Math.min(c-1,4)*.15;[0,.07,.14].forEach((d,i)=>tone([523,659,784][i]*b,[523,659,784][i]*b*1.01,.22,'triangle',.16,d));},
  level:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.35,'triangle',.16,i*.09));tone(1046,2093,.6,'sine',.08,.45);},
  eat:()=>{tone(400,120,.18,'sawtooth',.1);tone(200,90,.2,'square',.06,.05);},
  err:()=>tone(200,140,.16,'square',.09),
  ui:()=>tone(800,1200,.06,'sine',.08),
};

/* ---------- FX ---------- */
const fx=$('#fx');
function floatText(x,y,txt,cls=''){const el=document.createElement('div');el.className='float '+cls;el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),1200);}
function coinBurst(x,y,n){for(let i=0;i<n;i++){const el=document.createElement('div');el.className='coinp';el.innerHTML='<img src="icons/coin.png" alt="">';const a=rnd(-Math.PI,0)+rnd(-.5,.5),d=rnd(40,110);el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',(Math.sin(a)*d-30)+'px');el.style.setProperty('--r',rnd(-180,180)+'deg');el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),800);}}
function sparks(x,y,n,colors){for(let i=0;i<n;i++){const el=document.createElement('div');el.className='spark';const a=rnd(0,Math.PI*2),d=rnd(30,90);el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d+'px');el.style.setProperty('--c',pick(colors));el.style.left=x+'px';el.style.top=y+'px';fx.appendChild(el);setTimeout(()=>el.remove(),700);}}
let toastT=null;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1600);}

/* ---------- HUD ---------- */
function updateHud(){
  $('#coins').textContent=fmt(state.coins);
  $('#lv').textContent=state.maxLv;
  $('#cost').textContent=fmt(spawnCost());
  $('#btnSpawn').classList.toggle('poor',state.coins<spawnCost());
  $('#btnSound').textContent=state.sound?'🔊':'🔇';
  updateHint();
}
function addCoins(v){state.coins+=v;const p=$('#coinPill');p.classList.remove('bump');void p.offsetWidth;p.classList.add('bump');updateHud();}
function updateHint(){
  const h=$('#hint');let t='';
  const count=state.cells.filter(Boolean).length;
  if(count===0&&state.coins<spawnCost())t='👇 Тапай по лягушке — копи монеты';
  else if(count<3&&state.coins>=spawnCost())t='Жми «Призвать» — лягушки появятся на поле';
  else if(count>=3&&state.merges===0)t='Собери 3 одинаковых в ряд — перетащи лягушку';
  else if(count===CELLS)t='Поле заполнено! Соедини или скорми лягушку кликеру';
  h.textContent=t;h.classList.toggle('hide',!t);
}

/* ---------- BOARD ---------- */
const board=$('#board');
const cellEls=[], els=Array(CELLS).fill(null);
let cs=60;
const cellXY=i=>[PAD+(i%N)*(cs+GAP),PAD+Math.floor(i/N)*(cs+GAP)];
function layout(){
  const w=board.clientWidth;cs=(w-PAD*2-GAP*(N-1))/N;
  board.style.setProperty('--cs',cs+'px');
  cellEls.forEach((c,i)=>{const [x,y]=cellXY(i);c.style.left=x+'px';c.style.top=y+'px';c.style.width=cs+'px';c.style.height=cs+'px';});
  els.forEach((el,i)=>el&&position(el,i));
}
function position(el,i){const [x,y]=cellXY(i);el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');}
for(let i=0;i<CELLS;i++){const c=document.createElement('div');c.className='cell';board.appendChild(c);cellEls.push(c);}
function makeFrogEl(i,lv,pop=true){
  const el=document.createElement('div');el.className='frog'+(pop?' pop':'');
  el.innerHTML=`<img alt=""><span class="lvl">${lv}</span>`;
  const img=el.firstChild;if(thumbs.has(lv))img.src=thumbs.get(lv);else thumb(lv).then(u=>img.src=u);
  el.style.transition='none';position(el,i);board.appendChild(el);void el.offsetWidth;el.style.transition='';
  els[i]=el;setTimeout(()=>{el.classList.remove('pop');el.classList.add('idle');el.querySelector('img').style.animationDelay=(-Math.random()*2.6)+'s';},520);
  return el;
}
function cellCenter(i){const r=board.getBoundingClientRect();const [x,y]=cellXY(i);return [r.left+x+cs/2,r.top+y+cs/2];}
function cellAt(clientX,clientY){const r=board.getBoundingClientRect();const x=clientX-r.left-PAD,y=clientY-r.top-PAD;if(x<0||y<0)return -1;const c=Math.floor(x/(cs+GAP)),rr=Math.floor(y/(cs+GAP));if(c<0||c>=N||rr<0||rr>=N)return -1;return rr*N+c;}

/* line finding */
function findLine(focus){
  const c=state.cells,runs=[];
  for(let r=0;r<N;r++){let s=0;for(let x=1;x<=N;x++){if(x===N||c[r*N+x]!==c[r*N+s]){if(x-s>=3&&c[r*N+s]>0){const a=[];for(let k=s;k<x;k++)a.push(r*N+k);runs.push(a);}s=x;}}}
  for(let col=0;col<N;col++){let s=0;for(let y=1;y<=N;y++){if(y===N||c[y*N+col]!==c[s*N+col]){if(y-s>=3&&c[s*N+col]>0){const a=[];for(let k=s;k<y;k++)a.push(k*N+col);runs.push(a);}s=y;}}}
  if(!runs.length)return null;
  let run=runs.find(r=>r.includes(focus))||runs[0];
  let win;
  const fi=run.indexOf(focus);
  if(fi>=0){let st=Math.min(Math.max(fi-1,0),run.length-3);win=run.slice(st,st+3);}
  else win=run.slice(0,3);
  const target=fi>=0?focus:win[1];
  return {win,target};
}
let busy=false;
async function mergeCells(win,target,combo){
  const lv=state.cells[target];
  for(const i of win){if(i!==target){els[i].classList.add('merging');position(els[i],target);}}
  win.forEach(i=>state.cells[i]=0);
  await wait(230);
  for(const i of win){els[i].remove();els[i]=null;}
  const nl=lv+1;state.cells[target]=nl;makeFrogEl(target,nl);state.merges++;
  const [x,y]=cellCenter(target);
  sparks(x,y,14,['#ffd23f','#9dffb0','#fff','#7fe3ff']);
  S.merge(combo);haptic.heavy();
  const reward=mergeReward(nl,combo);addCoins(reward);
  floatText(x,y-cs*.4,(combo>1?'x'+combo+' КОМБО  ':'')+'+'+fmt(reward),'big');
  if(nl>state.maxLv){await levelUp(nl);}
  thumb(nl+1).catch(()=>{});
}
async function resolve(focus){
  busy=true;let combo=0,line;
  while((line=findLine(focus))){combo++;await mergeCells(line.win,line.target,combo);focus=line.target;await wait(140);}
  busy=false;save();updateHud();
}

/* drag & drop */
let drag=null, selected=-1;
function setSelected(i){if(selected>=0&&els[selected])els[selected].classList.remove('selected');selected=i;if(i>=0&&els[i])els[i].classList.add('selected');}
function clearHl(){cellEls.forEach(c=>c.classList.remove('hl'));$('#clicker').classList.remove('feed');}
board.addEventListener('pointerdown',e=>{
  if(busy)return;audio();
  const i=cellAt(e.clientX,e.clientY);if(i<0)return;
  if(state.cells[i]){
    drag={from:i,x0:e.clientX,y0:e.clientY,moving:false,over:i};
    try{board.setPointerCapture(e.pointerId);}catch(err){}
  }else if(selected>=0){moveFrog(selected,i);setSelected(-1);}
});
board.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moving){if(Math.hypot(dx,dy)<6)return;drag.moving=true;setSelected(-1);els[drag.from].classList.add('dragging');S.ui();}
  const el=els[drag.from];const [x,y]=cellXY(drag.from);
  el.style.setProperty('--x',(x+dx)+'px');el.style.setProperty('--y',(y+dy)+'px');
  const over=cellAt(e.clientX,e.clientY);
  const clk=$('#clicker').getBoundingClientRect();
  const feed=e.clientY>clk.top&&e.clientY<clk.bottom&&e.clientX>clk.left&&e.clientX<clk.right;
  if(over!==drag.over||feed!==drag.feed){clearHl();if(over>=0)cellEls[over].classList.add('hl');if(feed)$('#clicker').classList.add('feed');drag.over=over;drag.feed=feed;}
});
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;clearHl();
  const el=els[d.from];if(!el)return;
  el.classList.remove('dragging');
  if(!d.moving){ if(selected===d.from)setSelected(-1); else if(selected>=0){moveFrog(selected,d.from);setSelected(-1);} else {setSelected(d.from);S.ui();} return;}
  if(d.feed){feedFrog(d.from);return;}
  if(d.over>=0&&d.over!==d.from)moveFrog(d.from,d.over);else position(el,d.from);
}
board.addEventListener('pointerup',endDrag);board.addEventListener('pointercancel',endDrag);
function moveFrog(a,b){
  if(a===b||busy)return;
  const c=state.cells;const la=c[a],lb=c[b];
  c[b]=la;c[a]=lb;const ea=els[a],eb=els[b];els[b]=ea;els[a]=eb;
  if(ea)position(ea,b);if(eb)position(eb,a);
  S.ui();haptic.select();
  setTimeout(()=>resolve(b),60);
}
function feedFrog(i){
  const lv=state.cells[i];const el=els[i];if(!lv||!el)return;
  const clk=$('#clickerLottie').getBoundingClientRect(),br=board.getBoundingClientRect();
  el.classList.add('eaten');el.style.setProperty('--x',(clk.left+clk.width/2-br.left-cs/2)+'px');el.style.setProperty('--y',(clk.top+clk.height/2-br.top-cs/2)+'px');
  state.cells[i]=0;els[i]=null;
  const r=feedReward(lv);
  setTimeout(()=>{el.remove();addCoins(r);S.eat();haptic.medium();squash();clickerAnim&&clickerAnim.goToAndPlay(0);floatText(clk.left+clk.width/2,clk.top,'ням! +'+fmt(r),'big');coinBurst(clk.left+clk.width/2,clk.top+clk.height/2,5);save();updateHud();},260);
}

/* ---------- SPAWN ---------- */
function spawn(){
  if(busy)return false;
  const cost=spawnCost();
  const btn=$('#btnSpawn');
  if(state.coins<cost){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');S.err();haptic.error();return false;}
  const empty=[];state.cells.forEach((v,i)=>{if(!v)empty.push(i);});
  if(!empty.length){toast('Поле заполнено! Соедини лягушек или скорми лишнюю кликеру');S.err();return false;}
  state.coins-=cost;
  const i=pick(empty),lv=rollSpawnLevel();
  state.cells[i]=lv;makeFrogEl(i,lv);
  const [x,y]=cellCenter(i);sparks(x,y,8,['#9dffb0','#fff']);
  if(lv>baseSpawnLv())floatText(x,y-cs*.5,'✨ ур.'+lv,'');
  S.spawn();haptic.light();updateHud();
  resolve(i);
  return true;
}
{
  const btn=$('#btnSpawn');let t=null;
  const stop=()=>{clearTimeout(t);t=null;btn.classList.remove('down');};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();audio();btn.classList.add('down');if(!spawn())return;let delay=380;const rep=()=>{if(!spawn()){stop();return;}delay=Math.max(140,delay*.8);t=setTimeout(rep,delay);};t=setTimeout(rep,delay);});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,stop));
}

/* ---------- CLICKER ---------- */
let clickerAnim=null;
async function setClickerSkin(lv){
  const data=structuredClone(await loadFrogData(lv));
  if(clickerAnim){clickerAnim.destroy();clickerAnim=null;}
  $('#clickerLottie').innerHTML='';
  clickerAnim=lottie.loadAnimation({container:$('#clickerLottie'),renderer:'svg',loop:true,autoplay:true,animationData:data,rendererSettings:{preserveAspectRatio:'xMidYMid meet',progressiveLoad:false}});
  $('#frogName').innerHTML=`${frogName(lv)} <small>+${fmt(tapValue())} за тап</small>`;
}
function squash(){const el=$('#clickerLottie');el.classList.add('squash');setTimeout(()=>el.classList.remove('squash'),90);}
let lastTap=0,streak=0,comboT=null;
function tap(e){
  audio();
  const now=performance.now();streak=(now-lastTap<650)?streak+1:1;lastTap=now;
  const mult=Math.min(3,1+Math.floor(streak/12));
  const crit=Math.random()<0.08;
  let v=tapValue()*mult;if(crit)v*=5;
  addCoins(v);
  const x=e.clientX,y=e.clientY;
  floatText(x+rnd(-20,20),y-20,(crit?'КРИТ! ':'')+'+'+fmt(v),crit?'crit':'');
  coinBurst(x,y,crit?7:2);if(crit)sparks(x,y,10,['#ffd23f','#fff']);
  squash();S.pop(crit);crit?haptic.medium():haptic.light();
  if(clickerAnim)clickerAnim.goToAndPlay(0);
  const cb=$('#combo');if(mult>1){$('#comboTxt').textContent='x'+mult+' · '+streak;cb.classList.add('on');}
  clearTimeout(comboT);comboT=setTimeout(()=>{cb.classList.remove('on');streak=0;},700);
}
$('#clicker').addEventListener('pointerdown',e=>{e.preventDefault();tap(e);});

/* ---------- LEVEL UP ---------- */
let luAnim=null;
async function levelUp(lv){
  state.maxLv=lv;if(!state.disc.includes(lv))state.disc.push(lv);
  save();updateHud();
  await setClickerSkin(lv);
  const ov=$('#levelup');
  $('#luName').textContent=frogName(lv);$('#luLvN').textContent=lv;
  const card=ov.querySelector('.card');card.querySelectorAll('.conf').forEach(c=>c.remove());
  for(let i=0;i<26;i++){const c=document.createElement('i');c.className='conf';c.style.left=rnd(0,100)+'%';c.style.setProperty('--c',pick(['#ffd23f','#9dffb0','#7fe3ff','#ff8fa3','#fff']));c.style.animationDelay=rnd(-2,0)+'s';c.style.animationDuration=rnd(1.8,3)+'s';card.appendChild(c);}
  if(luAnim)luAnim.destroy();$('#luLottie').innerHTML='';
  luAnim=lottie.loadAnimation({container:$('#luLottie'),renderer:'svg',loop:true,autoplay:true,animationData:structuredClone(await loadFrogData(lv))});
  ov.classList.remove('hidden');S.level();haptic.success();
  await new Promise(r=>{$('#luOk').onclick=()=>{ov.classList.add('hidden');luAnim.destroy();luAnim=null;S.ui();r();};});
}

/* ---------- COLLECTION ---------- */
function openCollection(){
  const g=$('#colGrid');g.innerHTML='';
  $('#colCount').textContent=state.disc.length+'/'+LEVELS.length;
  LEVELS.forEach((L,i)=>{const lv=i+1,d=state.disc.includes(lv);const s=document.createElement('div');s.className='slot'+(d?'':' locked')+(lv===state.maxLv?' cur':'');s.innerHTML=`<span class="n">${lv}</span><img alt=""><span>${d?L.n:'???'}</span>`;if(d||lv<=state.maxLv+1){thumb(lv).then(u=>s.querySelector('img').src=u);}else s.querySelector('img').remove();g.appendChild(s);});
  $('#collection').classList.remove('hidden');S.ui();
}
$('#btnCol').onclick=openCollection;
$('#colClose').onclick=()=>{$('#collection').classList.add('hidden');S.ui();};
function doReset(){resetting=true;clearTimeout(saveT);try{localStorage.removeItem(SAVE_KEY);}catch(e){}if(cloudOk()){try{TG.CloudStorage.removeItem(SAVE_KEY,()=>location.reload());return;}catch(e){}}location.reload();}
$('#btnReset').onclick=()=>{if(TG&&tgv('6.2')){TG.showConfirm('Сбросить весь прогресс?',ok=>{if(ok)doReset();});}else if(confirm('Сбросить весь прогресс?'))doReset();};
$('#btnSound').onclick=()=>{state.sound=!state.sound;save();updateHud();S.ui();};

/* ---------- INIT ---------- */
async function init(){
  await load();
  const need=new Set([0,1,...state.cells.filter(Boolean),state.maxLv,state.maxLv+1]);
  for(let l=baseSpawnLv();l<=state.maxLv+1;l++)need.add(l);
  const list=[...need].filter(l=>l<=LEVELS.length);let done=0;
  await Promise.all(list.map(l=>thumb(l).then(()=>{done++;$('#loadBar').style.width=(done/list.length*100)+'%';})));
  $('#spawnIcon').src=thumbs.get(0);
  layout();
  state.cells.forEach((lv,i)=>{if(lv)makeFrogEl(i,lv,false);});
  await setClickerSkin(state.maxLv);
  updateHud();
  $('#loading').classList.add('hidden');
  resolve(-1);
}
window.addEventListener('resize',layout);
if(TG){try{TG.onEvent('viewportChanged',layout);TG.onEvent('safeAreaChanged',layout);}catch(e){}}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.__frog={state,spawn,resolve,thumbs};
init().catch(e=>{console.error(e);$('#loading h2').textContent='Ошибка загрузки: '+e.message;});
})();
</script>
